<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>개폐기류 제조사 자체검사 기록 프로그램</title>
  <script>
    (() => {
      try { document.documentElement.dataset.theme = localStorage.getItem("mfr_ui_theme_v1") || "light"; }
      catch (err) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>
  <style>
    :root, html[data-theme="dark"] {
      --bg:#0b1220; --card:#0f1a33; --line:rgba(255,255,255,.09);
      --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.62);
      --accent:#7dd3fc; --warn:#fbbf24; --good:#34d399; --bad:#f87171;
      --chip:rgba(255,255,255,.06); --shadow:0 12px 40px rgba(0,0,0,.35);
      --bodybg: radial-gradient(900px 500px at 20% -10%, rgba(125,211,252,.18), transparent 60%),
                radial-gradient(700px 400px at 80% 0%, rgba(167,139,250,.16), transparent 55%),
                linear-gradient(180deg,#050a14,#0b1220 30%,#050a14);
    }
    html[data-theme="light"] {
      --bg:#f4f6fb; --card:#ffffff; --line:rgba(15,23,42,.12);
      --text:#0f172a; --muted:#5b6478;
      --accent:#1d56bc; --warn:#b45309; --good:#0a7f45; --bad:#c02434;
      --chip:rgba(15,23,42,.05); --shadow:0 10px 28px rgba(15,23,42,.10);
      --bodybg: linear-gradient(180deg,#eef2fa,#f6f8fc 40%,#f4f6fb);
    }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bodybg); color:var(--text); min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif; }
    .wrap { max-width:1180px; margin:0 auto; padding:20px }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
      box-shadow:var(--shadow); padding:16px; margin-bottom:14px }
    h1 { font-size:19px; margin:0 0 2px }
    h2 { font-size:15px; margin:0 0 10px }
    .sub { color:var(--muted); font-size:12.5px }
    .muted { color:var(--muted) }
    .top { display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; margin-bottom:14px }
    .pill { background:var(--chip); border:1px solid var(--line); border-radius:999px;
      padding:5px 12px; font-size:12px; color:var(--muted) }
    button { font:inherit; cursor:pointer; border-radius:9px; border:1px solid var(--line);
      background:var(--chip); color:var(--text); padding:8px 14px }
    button:hover { border-color:var(--accent) }
    button.primary { background:var(--accent); color:#fff; border-color:transparent; font-weight:700 }
    html[data-theme="dark"] button.primary { color:#06263c }
    button.ghost { background:transparent }
    button:disabled { opacity:.45; cursor:not-allowed }
    input, select, textarea { font:inherit; color:var(--text); background:var(--bg);
      border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100% }
    textarea { resize:vertical; min-height:54px }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px }
    label.f { display:block; font-size:12px; color:var(--muted); margin-bottom:4px }
    .grid { display:grid; gap:10px }
    .g2 { grid-template-columns:repeat(2,1fr) } .g3 { grid-template-columns:repeat(3,1fr) }
    .g4 { grid-template-columns:repeat(4,1fr) }
    @media (max-width:820px){ .g2,.g3,.g4 { grid-template-columns:1fr } }
    table { width:100%; border-collapse:collapse; font-size:13px }
    th, td { border:1px solid var(--line); padding:7px 8px; text-align:center; vertical-align:middle }
    th { background:var(--chip); font-weight:700; font-size:12px }
    td.l, th.l { text-align:left }
    .steps { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px }
    .steps button { font-size:12.5px; padding:7px 12px }
    .steps button.on { background:var(--accent); color:#fff; border-color:transparent; font-weight:700 }
    html[data-theme="dark"] .steps button.on { color:#06263c }
    .jbtn { border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:700 }
    .jbtn.on-good { background:var(--good); color:#fff; border-color:transparent }
    .jbtn.on-bad { background:var(--bad); color:#fff; border-color:transparent }
    .jbtn.on-na { background:var(--muted); color:var(--card); border-color:transparent }
    .badge { display:inline-block; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:700 }
    .badge.good { background:rgba(16,185,129,.16); color:var(--good) }
    .badge.bad { background:rgba(239,68,68,.16); color:var(--bad) }
    .badge.na { background:var(--chip); color:var(--muted) }
    tr.rowbad > td { background:rgba(239,68,68,.07) }
    .panel { border:1px dashed var(--line); border-radius:10px; padding:12px; margin-top:8px; background:var(--chip) }
    .panel.bad { border-color:var(--bad); border-style:solid; background:rgba(239,68,68,.06) }
    .kpi { display:grid; grid-template-columns:repeat(5,1fr); gap:10px }
    @media (max-width:900px){ .kpi { grid-template-columns:repeat(2,1fr) } }
    .kpi .b { background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:12px; color:var(--muted) }
    .kpi .b b { display:block; font-size:22px; margin-top:3px; color:var(--text) }
    .hint { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.6 }
    .row-act { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:12px }
    .lim { font-size:11.5px; color:var(--muted) }
    .fitgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:7px }
    .fitgrid .cell.over input { border-color:var(--bad); color:var(--bad); font-weight:700 }
    .fitgrid .cell label { font-size:11px; color:var(--muted); display:block; margin-bottom:2px }
    .hidden { display:none !important }
    @media print {
      body { background:#fff } .card { box-shadow:none; break-inside:avoid }
      .row-act, .steps, .top button, #secBase, #draftCard { display:none !important }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>개폐기류 제조사 자체검사 기록 프로그램</h1>
        <div class="sub">제조사 자체 품질검사 기록 · 불량 상세사유 관리 <span id="appVer">ver.</span></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="pill" id="pillDate"></span>
        <button class="ghost" id="btnTheme">테마</button>
      </div>
    </div>

    <div class="card" id="draftCard" style="display:none">
      <h2>작성 이어하기</h2>
      <div class="sub" id="draftInfo"></div>
      <div class="row-act">
        <button class="ghost" id="btnDraftDrop">삭제하고 새로 시작</button>
        <button class="primary" id="btnDraftGo">이어서 작성</button>
      </div>
    </div>

    <div class="card" id="secBase">
      <h2>1. 기본정보</h2>
      <div class="grid g3">
        <div>
          <label class="f">제조업체</label>
          <select id="fMaker"></select>
        </div>
        <div id="wrapMakerEtc" style="display:none">
          <label class="f">업체명 직접입력</label>
          <input id="fMakerEtc" placeholder="업체명">
        </div>
        <div>
          <label class="f">품목(규격)</label>
          <select id="fSpec"></select>
        </div>
        <div>
          <label class="f">형식</label>
          <select id="fVariant"></select>
        </div>
      </div>
      <div class="grid g4" style="margin-top:10px">
        <div><label class="f">제조 로트번호</label><input id="fLot" placeholder="예: 496100"></div>
        <div><label class="f">생산(검사대상) 수량</label><input id="fQty" type="number" min="0" step="1" placeholder="예: 200"></div>
        <div><label class="f">검사 시작일</label><input id="fD1" type="date"></div>
        <div><label class="f">검사 종료일</label><input id="fD2" type="date"></div>
      </div>
      <div class="grid g3" style="margin-top:10px">
        <div><label class="f">검사 담당자</label><input id="fWriter" placeholder="성명"></div>
        <div><label class="f">제조번호 범위(선택)</label><input id="fSerial" placeholder="예: 26-001 ~ 26-200"></div>
        <div><label class="f">비고</label><input id="fMemo" placeholder="특이사항"></div>
      </div>
      <div class="hint">
        · 이 프로그램은 <b>제조사 자체검사용</b>입니다. 한전 검수용 항목(품질등급 · 검수자 서명 · 시험사진 · 첨부파일)은 포함하지 않습니다.<br>
        · 검사수량은 항목별로 직접 입력하며 기본값은 생산수량(전수)입니다. 판정을 <b>불량</b>으로 선택하면 상세사유 입력란이 열립니다.
      </div>
      <div class="row-act">
        <button class="ghost" id="btnLoad">파일 불러오기</button>
        <input type="file" id="fileLoad" accept=".json,application/json" style="display:none">
        <button class="primary" id="btnStart">검사표 작성 시작</button>
      </div>
    </div>

    <div class="card hidden" id="secTest">
      <div class="steps" id="stepTabs"></div>
      <div id="stepBody"></div>
      <div class="row-act">
        <button class="ghost" id="btnBack">이전</button>
        <button class="ghost" id="btnSave">중간저장</button>
        <button class="primary" id="btnNext">다음</button>
      </div>
    </div>

    <div class="card hidden" id="secSum">
      <h2>검사결과 요약</h2>
      <div id="sumHead" class="sub" style="margin-bottom:10px"></div>
      <div class="kpi" id="sumKpi"></div>
      <div style="margin-top:14px;overflow-x:auto"><table id="sumTable"></table></div>
      <div class="hint" id="sumHint"></div>
      <div class="row-act">
        <button class="ghost" id="btnSumBack">항목 수정</button>
        <button class="ghost" id="btnPrint">인쇄 / PDF</button>
        <button class="primary" id="btnExport">검사기록 저장(JSON)</button>
      </div>
    </div>
  </div>

  <script>
    /* ===== 공용 데이터 =====
       한전 「개폐기류 성적서 작성프로그램」의 업체 목록 · 품목/시험항목 정의 ·
       업체별 주회로 저항 기준치를 그대로 사용해 동일한 기준으로 자체검사한다.
       (발취수량 함수 S는 SPECS 정의가 참조하므로 포함하되, 자체검사에서는 사용하지 않는다) */
    const MAKERS = [{"name":"(주)디투엔지니어링"},{"name":"(주)비츠로일렉트릭"},{"name":"(주)에스얜에스"},{"name":"(주)엘파워텍"},{"name":"(주)엠에스그리드"},{"name":"(주)이앤엠테크"},{"name":"(주)이엔에스일렉트릭"},{"name":"(주)이페스"},{"name":"(주)이플전기"},{"name":"(주)케이피 일렉트릭"},{"name":"(주)테크프로"},{"name":"경동중전기(주)"},{"name":"구주기술(주)"},{"name":"구주진광 주식회사"},{"name":"동방전기공업 주식회사"},{"name":"동우일렉트릭 주식회사"},{"name":"리파워솔루션(주)"},{"name":"보국전기공업(주)"},{"name":"보성파워텍(주)"},{"name":"부흥시스템 주식회사"},{"name":"샤든코리아 (주)"},{"name":"서창전기통신(주)"},{"name":"선도전기(주)"},{"name":"선일전기공업(주)"},{"name":"시앤파워텍"},{"name":"신성산전(주)"},{"name":"신우전기제조(주)"},{"name":"쌍용전기 주식회사"},{"name":"유호전기공업(주)"},{"name":"이엔테크 주식회사"},{"name":"이화산업전력(주)"},{"name":"인텍전기전자 주식회사"},{"name":"일진홀딩스(주)"},{"name":"주식회사 광명전기"},{"name":"주식회사 델코코(Delcoco Co.Ltd)"},{"name":"주식회사 동양이이씨"},{"name":"주식회사 두레콤"},{"name":"주식회사 디티알"},{"name":"주식회사 삼성파워텍"},{"name":"주식회사 서전기전"},{"name":"주식회사 스위코진광"},{"name":"주식회사 알텍시스템"},{"name":"주식회사 에스지이엠"},{"name":"주식회사 이피이"},{"name":"주식회사 정인시스템"},{"name":"주식회사파워맥스"},{"name":"중앙산업(주)"},{"name":"중원 주식회사"},{"name":"피앤에이파워시스템 주식회사"},{"name":"피에스텍(주)"}];

    const S = {
      fixed:(n)=>()=>n,
      note2_efi:(q)=> q<=50?1:3,
      note1_dry:(q)=> q<=20?2:2+Math.ceil((q-20)/20),
      note4_dry:(q)=> q<5?q:1+Math.ceil((q-5)/5),
      note7_dry:(q)=> q<=100?1:(q<=200?2:3),
      note15_dry:(q)=> q<20?1:1+Math.ceil((q-20)/20),
      per:(u)=>(q)=>Math.max(1,Math.ceil(q/u)),
      all:(q)=>q,
    };

    const SPECS = [
      {
        id:'EFI', gsNo:'GS-5925-0135', name:'25.8kV 에폭시 고장구간 차단기(EFI)',
        install:'가공', unit:'대', keywords:['고장구간','차단기','efi','에폭시'],
        variants:[ {value:'25.8kV 400A 수동형(120920)',mode:'수동'}, {value:'25.8kV 400A 자동형(126314)',mode:'자동'} ],
        steps:[
          { key:'appear', title:'외관·구조검사', items:[
            { key:'ap_body', name:'구조 및 외관검사(본체)', ref:'7.3.1', crit:'4·5항 만족', full:true },
            { key:'ap_ctrl', name:'제어함 구조 및 외관검사', ref:'7.3.16', crit:'4.4항 만족', sampFn:S.per(50) },
          ]},
          { key:'insul', title:'절연시험', items:[
            { key:'ac_wv', name:'상용주파 내전압시험', ref:'7.3.7.1', crit:'건조 60kV·1분(검수 주수생략)', full:true },
            { key:'imp_wv', name:'충격파 내전압시험', ref:'7.3.7.2', crit:'150kV(1.2×50㎲)', sampFn:S.note2_efi, exemptSA:true },
            { key:'pd', name:'부분방전시험', ref:'7.3.9', crit:'20pC 이하', unit:'pC', thr:{v:20,dir:'le'}, pdPhase:true, sampFn:S.note2_efi },
            { key:'ctrl_ac', name:'제어회로 상용주파 내전압', ref:'7.3.20.1', crit:'2kV·1분', full:true },
            { key:'seal', name:'본체 밀봉시험', ref:'7.3.24', crit:'IP X8 1h→건조내전압', sampFn:S.per(50), exemptSA:true },
            { key:'ir', name:'절연저항 측정(제어회로)', ref:'7.3.12', crit:'측정', full:true },
          ]},
          { key:'func', title:'동작·기능시험', items:[
            { key:'novolt', name:'무전압 개폐시험', ref:'7.3.6', crit:'10회 이상없음', full:true },
            { key:'mintrip', name:'최소 Trip 전류시험', ref:'7.3.13', crit:'정정치 ±10%(90% 부동작 확인)', unit:'A', minTrip:true, noOp:true, sampFn:S.per(50) },
            { key:'tc', name:'T-C 특성시험', ref:'7.3.13', crit:'150%,300%,600%,1000% 단락요소·지락요소 이상없음', unit:'ms', tcTest:true, simpleJdg:true, tcTol:'efi', sampFn:S.per(50) },
            { key:'opfunc', name:'동작기능시험', ref:'7.3.14', crit:'6항(자동형 6.1)', sampFn:S.per(50) },
            { key:'opchk', name:'조작확인시험', ref:'7.3.15', crit:'이상없음', sampFn:S.per(50) },
            { key:'sys', name:'시스템연결 동작시험', ref:'7.3.28', crit:'H/W 포인트', autoOnly:true, sampFn:S.per(50) },
            { key:'dir', name:'방향성 동작시험', ref:'7.3.32', crit:'5.10항', autoOnly:true, sampFn:S.per(50) },
          ]},
          { key:'meas', title:'계측·기타', items:[
            { key:'mr', name:'주회로 저항측정', ref:'7.3.11', crit:'상별 측정(µΩ)', resistance:'overhead', sampFn:S.note2_efi },
            { key:'ai', name:'전류계측 정밀도 시험', ref:'7.3.26', crit:'1.0급/5P20', sampFn:S.per(25), exemptSA:true },
            { key:'av', name:'전압계측 정밀도 시험', ref:'7.3.27', crit:'±1%·±40분', autoOnly:true, sampFn:S.per(25), exemptSA:true },
            { key:'batt', name:'축전지 성능시험', ref:'7.3.33', crit:'투개방 CO 50회(휴지30s)·24V(19~29V), GS-6140-0034', cert:true, noDate:true, cycle:'성적서 대체', autoOnly:true },
            { key:'steel', name:'강판 재질시험(기계·화학)', ref:'7.3.21', crit:'KS D 3705', cert:true, cycle:'년 1회' },
            { key:'cover', name:'부싱단자 절연카바시험', ref:'7.3.22', crit:'ES-5970-0042', cert:true, noDate:true, cycle:'성적서 대체' },
            { key:'plate', name:'취부금구 도금시험', ref:'7.3.30', crit:'취부금구 70㎛↑ · 볼트·너트 50㎛↑', plating:true, unit:'㎛', sampFn:S.per(50) },
          ]},
        ],
        exemptKeys:['imp_wv','av','ai','seal'],
      },
      {
        id:'DRYAIR', gsNo:'GS-5925-0157', name:'25.8kV Dry-air 절연 부하개폐기(지중용)',
        install:'지중', unit:'대', keywords:['dry','부하개폐기','지중','드라이에어'],
        variants:[ {value:'3회로 수동형(127432)',mode:'수동',circuits:3}, {value:'3회로 자동형(127433)',mode:'자동',circuits:3},
                   {value:'4회로 수동형(127428)',mode:'수동',circuits:4}, {value:'4회로 자동형(127429)',mode:'자동',circuits:4} ],
        steps:[
          { key:'appear', title:'외관·구조검사', items:[
            { key:'ap_body', name:'구조 및 외관검사(본체)', ref:'7.2.1', crit:'5·6항 만족', sampFn:S.note4_dry, sampAdd:'필요시 시료수 증가 가능' },
            { key:'ap_ctrl', name:'제어함 구조 및 외관검사', ref:'7.2.23', crit:'5·6항 만족', autoOnly:true, sampFn:S.note4_dry, sampAdd:'필요시 시료수 증가 가능' },

  <script>
    /* =========================================================================
       개폐기류 제조사 자체검사 기록 프로그램
       - 한전 검수 프로그램(개폐기류 성적서 작성프로그램)의 품목·시험항목 정의를 그대로 사용하되,
         검수 전용 요소(품질등급 / 발취수량 자동산출 / 검수자·입회자 서명 / 시험사진 / 첨부파일)는 제외.
       - 제조사는 자체 검사수량(기본 전수)과 불량수량을 입력하고, 불량 판정 시 상세사유를 기록한다.
       ========================================================================= */

    const $ = id => document.getElementById(id);
    const fmtToday = () => new Date().toISOString().slice(0, 10);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const num = v => { const n = Number(String(v == null ? '' : v).trim()); return isFinite(n) && String(v).trim() !== '' ? n : NaN; };

    // 버전은 파일 최종 수정일로 자동 표기
    (() => {
      const d = new Date(document.lastModified);
      if (isNaN(d)) return;
      const p = n => String(n).padStart(2, '0');
      const v = 'ver.' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate());
      const el = $('appVer'); if (el) el.textContent = v;
      document.title = document.title.replace(/\s*ver\.\d+\s*$/, '') + ' ' + v;
    })();
    $('pillDate').textContent = '오늘 ' + fmtToday();
    $('btnTheme').onclick = () => {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = cur;
      try { localStorage.setItem('mfr_ui_theme_v1', cur); } catch (e) { }
    };

    // ===== 불량유형 분류 (대시보드 집계 기준) =====
    const DEFECT_TYPES = ['자재불량', '가공불량', '조립불량', '용접불량', '도장·도금불량',
      '절연물 불량', '기밀·누설', '전장·배선불량', '제어·소프트웨어', '설정·조정불량',
      '작업자 실수', '설계문제', '외주품 불량', '기타'];

    // ===== 상태 =====
    // M = { base:{...}, items:{ itemKey:{ checked, defects, jdg, vals:{}, sub, date, dfType, dfPhenom, dfCause, dfAction, dfPrevent, note } } }
    let CUR = null;           // { spec, variant, mode }
    let M = { base: {}, items: {} };
    let activeStep = 0;

    // ===== 검수 전용 로직 대체 유틸 =====
    function circuits() { return (CUR && CUR.spec.variants.find(v => v.value === CUR.variant) || {}).circuits || 0; }
    function isAuto() { return CUR && CUR.mode === '자동'; }
    function isPType() { const v = String((CUR || {}).variant || ''); return /-P(?![A-Za-z0-9])/.test(v) || v.includes('광고물'); }
    function effThr(it) { return (it.thrP && isPType()) ? it.thrP : it.thr; }
    function effCrit(it) { return (it.critP && isPType()) ? it.critP : it.crit; }
    function isNA(it) { return (it.autoOnly === true && !isAuto()) || (it.pOnly === true && !isPType()); }
    function resFields(item) {
      if (item.resistance === 'overhead') return [{ lab: 'A상(R)' }, { lab: 'B상(S)' }, { lab: 'C상(T)' }];
      const n = circuits() || 4; const terms = [];
      for (let i = 1; i <= n; i++) terms.push(i);
      const pairs = []; for (let i = 0; i < terms.length; i++) for (let j = i + 1; j < terms.length; j++) pairs.push([terms[i], terms[j]]);
      const fields = []; ['A', 'B', 'C'].forEach(ph => pairs.forEach(p => fields.push({ lab: `${ph}${p[0]}-${ph}${p[1]}` })));
      return fields;
    }
    // 업체별 주회로 저항 기준치 세트
    function mcrSets() {
      const mk = M.base.maker, sp = (CUR || {}).spec;
      if (!mk || !sp) return [];
      const byspec = (MCR_LIMITS[mk] || {})[sp.id] || [];
      const n = circuits() || 0;
      return n ? byspec.filter(e => e.circuits === n) : byspec.filter(e => !e.circuits);
    }
    function mcrPick(it) {
      const sets = mcrSets(); if (!sets.length) return null;
      const i = Math.min(Math.max(Number((M.items[it.key] || {}).mcrSet) || 0, 0), sets.length - 1);
      return { sets, idx: i, set: sets[i] };
    }

    // ===== 항목별 측정 필드 정의 =====
    // 제조사 자체검사에서는 항목당 '대표 측정값'을 입력한다(검수처럼 발취 호기별 표를 만들지 않는다).
    function measFields(it) {
      if (it.resistance) return resFields(it).map(f => ({ lab: f.lab, unit: 'µΩ', kind: 'mcr' }));
      if (it.plating) return [{ lab: '취부금구', unit: '㎛', kind: 'num', thr: { v: 70, dir: 'ge' } },
                              { lab: '볼트·너트', unit: '㎛', kind: 'num', thr: { v: 50, dir: 'ge' } }];
      if (it.paintTest) {
        const t = isPType() ? 120 : 60;
        return [{ lab: '도장두께', unit: '㎛', kind: 'num', thr: { v: t, dir: 'ge' } },
                { lab: '밀착성', kind: 'jdg' }, { lab: '충돌시험', kind: 'jdg' }, { lab: '부착력시험', kind: 'jdg' }];
      }
      if (it.pdPhase) return ['A상', 'B상', 'C상'].map(p => ({ lab: p, unit: it.unit || 'pC', kind: 'num', thr: effThr(it) }));
      if (it.phaseConn) return ['A상', 'B상', 'C상'].map(p => ({ lab: p, unit: it.unit || 'mm', kind: 'num', thr: effThr(it), range: it.range }));
      if (it.minTrip) return [{ lab: '동작전류', unit: it.unit || 'A', kind: 'num' }, { lab: '90% 부동작', kind: 'jdg' }];
      if (it.tcTest || it.seqTest) return [];   // 판정만
      if (it.thr || it.range || it.measureAuto || it.measureManual || (it.unit && !it.cert))
        return [{ lab: '측정값', unit: it.unit || '', kind: 'num', thr: effThr(it), range: it.range }];
      return [];
    }
    // 측정값 하나의 기준 초과 여부
    function overLimit(f, v, it) {
      if (!isFinite(v)) return false;
      if (f.kind === 'mcr') {
        const pick = mcrPick(it); if (!pick) return false;
        const lim = pick.set.vals[f.lab];
        return lim !== undefined && v > Number(lim);
      }
      if (f.range) return v < f.range.min || v > f.range.max;
      if (f.thr) return f.thr.dir === 'le' ? v > f.thr.v : v < f.thr.v;
      return false;
    }
    function limitText(f, it) {
      if (f.kind === 'mcr') {
        const pick = mcrPick(it); if (!pick) return '';
        const lim = pick.set.vals[f.lab];
        return lim === undefined ? '' : '≤ ' + lim;
      }
      if (f.range) return `${f.range.min} ~ ${f.range.max}`;
      if (f.thr) return (f.thr.dir === 'le' ? '≤ ' : '≥ ') + f.thr.v;
      return '';
    }
    // 측정값 기반 자동 판정 (하나라도 기준 밖 → 불량, 전부 입력·기준 내 → 양호)
    function autoJdg(it) {
      const fs = measFields(it); if (!fs.length) return '';
      const st = M.items[it.key] || {}; const vals = st.vals || {};
      let filled = 0, bad = false;
      for (const f of fs) {
        const raw = vals[f.lab];
        if (f.kind === 'jdg') { if (raw) { filled++; if (raw === '불량') bad = true; } continue; }
        const v = num(raw);
        if (!isFinite(v)) continue;
        filled++;
        if (overLimit(f, v, it)) bad = true;
      }
      if (!filled) return '';
      if (bad) return '불량';
      return filled === fs.length ? '양호' : '';
    }

    // ===== 화면 구성 =====
    function stepDefs() { return CUR ? CUR.spec.steps : []; }

    function fillSpecSelect() {
      $('fSpec').innerHTML = SPECS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    }
    function fillMakerSelect() {
      $('fMaker').innerHTML = '<option value="">-- 업체 선택 --</option>'
        + MAKERS.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('')
        + '<option value="__etc">기타(직접입력)</option>';
    }
    function fillVariantSelect() {
      const sp = SPECS.find(s => s.id === $('fSpec').value) || SPECS[0];
      $('fVariant').innerHTML = sp.variants.map(v =>
        `<option value="${esc(v.value)}">${esc(v.value)}${v.mode ? ' · ' + v.mode : ''}</option>`).join('');
    }
    function readBase() {
      const mkSel = $('fMaker').value;
      const maker = mkSel === '__etc' ? ($('fMakerEtc').value || '').trim() : mkSel;
      const sp = SPECS.find(s => s.id === $('fSpec').value) || SPECS[0];
      const variant = $('fVariant').value;
      const mode = (sp.variants.find(v => v.value === variant) || {}).mode || '';
      return {
        maker, spec_id: sp.id, material: sp.name, gsNo: sp.gsNo || '', install: sp.install || '',
        variant, mode,
        lot_no: ($('fLot').value || '').trim(),
        qty: Number($('fQty').value) || 0,
        d1: $('fD1').value, d2: $('fD2').value,
        writer: ($('fWriter').value || '').trim(),
        serial: ($('fSerial').value || '').trim(),
        memo: ($('fMemo').value || '').trim(),
      };
    }
    function writeBase(b) {
      const known = MAKERS.some(m => m.name === b.maker);
      $('fMaker').value = known ? b.maker : (b.maker ? '__etc' : '');
      $('wrapMakerEtc').style.display = known || !b.maker ? 'none' : '';
      $('fMakerEtc').value = known ? '' : (b.maker || '');
      $('fSpec').value = b.spec_id; fillVariantSelect();
      $('fVariant').value = b.variant;
      $('fLot').value = b.lot_no || ''; $('fQty').value = b.qty || '';
      $('fD1').value = b.d1 || ''; $('fD2').value = b.d2 || '';
      $('fWriter').value = b.writer || ''; $('fSerial').value = b.serial || ''; $('fMemo').value = b.memo || '';
    }

    function startFlow() {
      const b = readBase();
      if (!b.maker) { alert('제조업체를 선택하세요.'); return; }
      if (!b.lot_no) { alert('제조 로트번호를 입력하세요.'); return; }
      if (!b.qty) { alert('생산(검사대상) 수량을 입력하세요.'); return; }
      M.base = b;
      CUR = { spec: SPECS.find(s => s.id === b.spec_id), variant: b.variant, mode: b.mode };
      // 항목 상태 초기화(불러오기로 이미 값이 있으면 유지)
      stepDefs().forEach(sd => sd.items.forEach(it => {
        if (!M.items[it.key]) M.items[it.key] = { checked: b.qty, defects: 0, jdg: '', vals: {} };
      }));
      activeStep = 0;
      $('secBase').classList.add('hidden');
      $('secTest').classList.remove('hidden');
      $('secSum').classList.add('hidden');
      renderStep();
      saveDraft();
    }

    function renderTabs() {
      const sd = stepDefs();
      $('stepTabs').innerHTML = sd.map((s, i) =>
        `<button data-i="${i}" class="${i === activeStep ? 'on' : ''}">${i + 1}. ${esc(s.title)}</button>`).join('')
        + `<button data-i="sum" class="${activeStep === 'sum' ? 'on' : ''}">요약</button>`;
      $('stepTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
        const v = b.dataset.i;
        if (v === 'sum') { showSummary(); return; }
        activeStep = Number(v); $('secSum').classList.add('hidden'); $('secTest').classList.remove('hidden'); renderStep();
      });
    }

    function renderStep() {
      renderTabs();
      const sd = stepDefs()[activeStep];
      if (!sd) return;
      const rows = sd.items.map(it => itemRowHTML(it)).join('');
      $('stepBody').innerHTML = `
        <h2>${activeStep + 1}. ${esc(sd.title)}</h2>
        <div style="overflow-x:auto"><table>
          <thead><tr>
            <th class="l" style="min-width:210px">시험항목</th>
            <th style="min-width:190px" class="l">판정기준</th>
            <th style="width:92px">검사수량</th>
            <th style="width:92px">불량수량</th>
            <th style="width:88px">불량률</th>
            <th style="min-width:186px">판정</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
      bindStep();
      $('btnBack').disabled = activeStep === 0;
      $('btnNext').textContent = activeStep === stepDefs().length - 1 ? '요약으로' : '다음';
    }

    function itemRowHTML(it) {
      const st = M.items[it.key] || {};
      const na = isNA(it);
      const jdg = na ? '해당없음' : (st.jdg || '');
      const chk = na ? 0 : (st.checked == null ? M.base.qty : st.checked);
      const df = na ? 0 : (Number(st.defects) || 0);
      const rate = chk > 0 ? (df / chk * 100) : 0;
      const cyc = it.cycle ? ` <span class="lim">· ${esc(it.cycle)}</span>` : '';
      const detail = na ? '' : itemDetailHTML(it);
      return `
      <tr data-k="${it.key}" class="${jdg === '불량' ? 'rowbad' : ''}">
        <td class="l"><b>${esc(it.name)}</b>${cyc}<div class="lim">${esc(it.ref || '')}</div></td>
        <td class="l"><span class="lim">${esc(effCrit(it) || '')}</span></td>
        <td>${na ? '-' : `<input type="number" min="0" step="1" data-f="checked" value="${chk}">`}</td>
        <td>${na ? '-' : `<input type="number" min="0" step="1" data-f="defects" value="${df}">`}</td>
        <td>${na ? '-' : `<span class="badge ${df > 0 ? 'bad' : 'good'}">${rate.toFixed(2)}%</span>`}</td>
        <td>${na
          ? '<span class="badge na">해당없음</span>'
          : `<button class="jbtn ${jdg === '양호' ? 'on-good' : ''}" data-f="jdg" data-v="양호">양호</button>
             <button class="jbtn ${jdg === '불량' ? 'on-bad' : ''}" data-f="jdg" data-v="불량">불량</button>`}</td>
      </tr>
      ${detail ? `<tr class="drow" data-k="${it.key}"><td colspan="6" class="l" style="padding:0 8px 10px">${detail}</td></tr>` : ''}`;
    }

    function itemDetailHTML(it) {
      const st = M.items[it.key] || {};
      let html = '';
      // (1) 서류 대체 항목
      if (it.cert) {
        html += `<div class="panel"><div class="grid g3">
          <div><label class="f">제출 여부</label>
            <select data-f="sub">
              <option value=""${!st.sub ? ' selected' : ''}>선택</option>
              <option value="제출"${st.sub === '제출' ? ' selected' : ''}>제출</option>
              <option value="미제출"${st.sub === '미제출' ? ' selected' : ''}>미제출</option>
            </select></div>
          ${it.noDate ? '' : `<div><label class="f">시험(발행) 일자</label><input type="date" data-f="date" value="${esc(st.date || '')}"></div>`}
          <div><label class="f">성적서 번호 / 발행처</label><input data-f="note" value="${esc(st.note || '')}" placeholder="예: KTL 2026-0001"></div>
        </div></div>`;
      }
      // (2) 측정값
      const fs = measFields(it);
      if (fs.length) {
        const pick = it.resistance ? mcrPick(it) : null;
        let head = '';
        if (it.resistance) {
          head = pick
            ? `<div class="lim" style="margin-bottom:6px">업체 기준치 세트:
                 <select data-f="mcrSet" style="width:auto;display:inline-block">
                   ${pick.sets.map((s, i) => `<option value="${i}"${i === pick.idx ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}
                 </select> (기준치 초과 시 붉게 표시)</div>`
            : `<div class="lim" style="margin-bottom:6px">등록된 업체 기준치가 없습니다 — 측정값만 기록되며 판정은 직접 선택하세요.</div>`;
        }
        html += `<div class="panel">${head}<div class="fitgrid">` + fs.map(f => {
          const v = (st.vals || {})[f.lab] == null ? '' : (st.vals || {})[f.lab];
          if (f.kind === 'jdg') {
            return `<div class="cell"><label>${esc(f.lab)}</label>
              <select data-f="val" data-lab="${esc(f.lab)}">
                <option value=""${!v ? ' selected' : ''}>-</option>
                <option value="양호"${v === '양호' ? ' selected' : ''}>양호</option>
                <option value="불량"${v === '불량' ? ' selected' : ''}>불량</option>
              </select></div>`;
          }
          const over = overLimit(f, num(v), it);
          const lt = limitText(f, it);
          return `<div class="cell ${over ? 'over' : ''}"><label>${esc(f.lab)}${f.unit ? ` (${esc(f.unit)})` : ''}${lt ? ` <span style="opacity:.75">${esc(lt)}</span>` : ''}</label>
            <input data-f="val" data-lab="${esc(f.lab)}" value="${esc(v)}" inputmode="decimal"></div>`;
        }).join('') + `</div></div>`;
      }
      // (3) 불량 상세사유 — 판정이 불량이거나 불량수량이 1 이상이면 표시
      const showDf = st.jdg === '불량' || (Number(st.defects) || 0) > 0;
      if (showDf) {
        html += `<div class="panel bad">
          <div style="font-weight:700;margin-bottom:8px;color:var(--bad)">불량 상세사유 (필수)</div>
          <div class="grid g2">
            <div><label class="f">불량유형</label>
              <select data-f="dfType">
                <option value=""${!st.dfType ? ' selected' : ''}>선택</option>
                ${DEFECT_TYPES.map(t => `<option value="${esc(t)}"${st.dfType === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}
              </select></div>
            <div><label class="f">발생 공정 / 위치</label><input data-f="dfWhere" value="${esc(st.dfWhere || '')}" placeholder="예: 조립3라인 / 부싱 접속부"></div>
          </div>
          <div style="margin-top:8px"><label class="f">불량 현상 (무엇이 어떻게 잘못되었는지)</label>
            <textarea data-f="dfPhenom" placeholder="예: B상 부분방전 32pC 측정(기준 20pC 이하)">${esc(st.dfPhenom || '')}</textarea></div>
          <div class="grid g2" style="margin-top:8px">
            <div><label class="f">원인</label><textarea data-f="dfCause" placeholder="예: 에폭시 몰딩 시 기포 혼입">${esc(st.dfCause || '')}</textarea></div>
            <div><label class="f">조치내용</label><textarea data-f="dfAction" placeholder="예: 해당 부싱 교체 후 재시험 20pC 이하 확인">${esc(st.dfAction || '')}</textarea></div>
          </div>
          <div style="margin-top:8px"><label class="f">재발방지 대책</label>
            <textarea data-f="dfPrevent" placeholder="예: 몰딩 진공시간 15분 → 25분 상향, 작업표준 개정">${esc(st.dfPrevent || '')}</textarea></div>
        </div>`;
      }
      return html;
    }

    function bindStep() {
      const body = $('stepBody');
      body.querySelectorAll('tr[data-k]').forEach(tr => {
        const key = tr.dataset.k;
        tr.querySelectorAll('[data-f]').forEach(el => {
          const f = el.dataset.f;
          if (f === 'jdg') {
            el.onclick = () => { setVal(key, 'jdg', M.items[key].jdg === el.dataset.v ? '' : el.dataset.v); renderStep(); };
            return;
          }
          if (f === 'val') {
            const h = () => { const st = M.items[key]; st.vals = st.vals || {}; st.vals[el.dataset.lab] = el.value; afterValue(key); };
            el.tagName === 'SELECT' ? (el.onchange = () => { h(); renderStep(); }) : (el.onchange = h, el.oninput = h);
            return;
          }
          if (f === 'mcrSet') { el.onchange = () => { setVal(key, 'mcrSet', Number(el.value) || 0); renderStep(); }; return; }
          if (f === 'checked' || f === 'defects') {
            el.onchange = () => { setVal(key, f, Math.max(0, Number(el.value) || 0)); renderStep(); };
            return;
          }
          const h2 = () => setVal(key, f, el.value);
          el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' ? (el.oninput = h2, el.onchange = h2) : (el.onchange = h2);
        });
      });
    }
    function setVal(key, f, v) {
      const st = M.items[key] = M.items[key] || {};
      st[f] = v;
      normalizeCounts(key);
      saveDraftSoon();
    }
    // 불량 판정인데 불량수량이 0이면 최소 1대로 잡아 준다(불량률 0%로 집계되는 것을 막는다).
    // 불량수량이 검사수량을 넘으면 검사수량으로 맞춘다.
    function normalizeCounts(key) {
      const st = M.items[key]; if (!st) return;
      const chk = st.checked == null ? M.base.qty : Number(st.checked) || 0;
      let df = Number(st.defects) || 0;
      if (st.jdg === '불량' && df === 0) df = 1;
      if (st.jdg === '양호') df = 0;
      if (df > chk) df = chk;
      st.defects = df;
      if (df > 0 && st.jdg !== '불량') st.jdg = '불량';
    }
    function afterValue(key) {
      const it = findItem(key); if (!it) return;
      const a = autoJdg(it);
      const st = M.items[key];
      if (a) { st.jdg = a; normalizeCounts(key); }
      saveDraftSoon();
      // 자동 판정 결과가 화면 판정 버튼/불량 패널과 어긋나면 다시 그린다
      const tr = $('stepBody').querySelector(`tr[data-k="${CSS.escape(key)}"]`);
      const shown = tr && tr.querySelector('.on-bad') ? '불량' : (tr && tr.querySelector('.on-good') ? '양호' : '');
      if (shown !== (st.jdg || '')) renderStep();
    }
    function findItem(key) {
      for (const sd of stepDefs()) { const it = sd.items.find(x => x.key === key); if (it) return it; }
      return null;
    }

    // ===== 요약 =====
    function collect() {
      const out = [];
      stepDefs().forEach(sd => sd.items.forEach(it => {
        const st = M.items[it.key] || {};
        const na = isNA(it);
        out.push({
          stepKey: sd.key, stepTitle: sd.title, key: it.key, name: it.name,
          ref: it.ref || '', crit: effCrit(it) || '', unit: it.unit || '', cycle: it.cycle || '',
          cert: !!it.cert, na,
          checked: na ? 0 : (st.checked == null ? M.base.qty : Number(st.checked) || 0),
          defects: na ? 0 : Number(st.defects) || 0,
          jdg: na ? '해당없음' : (st.jdg || ''),
          vals: st.vals || {}, sub: st.sub || '', date: st.date || '', note: st.note || '',
          defect: (st.jdg === '불량' || (Number(st.defects) || 0) > 0) ? {
            type: st.dfType || '', where: st.dfWhere || '', phenom: st.dfPhenom || '',
            cause: st.dfCause || '', action: st.dfAction || '', prevent: st.dfPrevent || ''
          } : null,
        });
      }));
      return out;
    }
    function summarize(items) {
      const eff = items.filter(i => !i.na);
      const checked = eff.reduce((s, i) => s + i.checked, 0);
      const defects = eff.reduce((s, i) => s + i.defects, 0);
      const badItems = eff.filter(i => i.jdg === '불량');
      const empty = eff.filter(i => !i.jdg);
      return {
        item_total: eff.length, checked_total: checked, defect_total: defects,
        defect_rate: checked ? defects / checked * 100 : 0,
        bad_item_count: badItems.length, empty_count: empty.length,
        judgement: empty.length ? '작성중' : (badItems.length ? '불합격' : '합격'),
      };
    }
    function showSummary() {
      activeStep = 'sum';
      $('secTest').classList.add('hidden'); $('secSum').classList.remove('hidden');
      renderTabs(); $('stepTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.i === 'sum'));
      const items = collect(), s = summarize(items), b = M.base;
      $('sumHead').innerHTML = `${esc(b.maker)} · ${esc(b.material)} · ${esc(b.variant)} · 로트 ${esc(b.lot_no)} · 생산 ${b.qty}대`;
      $('sumKpi').innerHTML = [
        ['검사항목', s.item_total + '개'], ['총 검사수량', s.checked_total.toLocaleString() + '대'],
        ['총 불량수', s.defect_total.toLocaleString() + '대'], ['불량률', s.defect_rate.toFixed(2) + '%'],
        ['종합판정', s.judgement]
      ].map(([k, v]) => `<div class="b">${k}<b>${v}</b></div>`).join('');
      const rows = items.map(i => `
        <tr class="${i.jdg === '불량' ? 'rowbad' : ''}">
          <td class="l">${esc(i.stepTitle)}</td><td class="l">${esc(i.name)}</td>
          <td>${i.na ? '-' : i.checked}</td><td>${i.na ? '-' : i.defects}</td>
          <td>${i.na ? '-' : (i.checked ? (i.defects / i.checked * 100).toFixed(2) : '0.00') + '%'}</td>
          <td><span class="badge ${i.jdg === '불량' ? 'bad' : i.jdg === '양호' ? 'good' : 'na'}">${esc(i.jdg || '미입력')}</span></td>
          <td class="l">${esc(i.defect ? [i.defect.type, i.defect.phenom].filter(Boolean).join(' · ') : '')}</td>
        </tr>`).join('');
      $('sumTable').innerHTML = `<thead><tr>
          <th class="l">단계</th><th class="l">시험항목</th><th>검사수량</th><th>불량수량</th><th>불량률</th><th>판정</th><th class="l">불량 요약</th>
        </tr></thead><tbody>${rows}</tbody>`;
      const miss = items.filter(i => i.defect && (!i.defect.type || !i.defect.phenom)).map(i => i.name);
      $('sumHint').innerHTML = (s.empty_count ? `· 판정 미입력 항목 ${s.empty_count}개가 있습니다.<br>` : '')
        + (miss.length ? `· 불량유형·현상이 비어 있는 항목: <b>${esc(miss.join(', '))}</b><br>` : '')
        + '· 저장한 JSON 파일을 「개폐기류 제조사 품질 대시보드」에서 불러오면 불량률·원인 통계를 볼 수 있습니다.';
      saveDraft();
    }

    // ===== 저장 / 불러오기 =====
    function buildRecord() {
      const items = collect();
      return {
        schema: 'KEPCO-MFR-SELF-1.0',
        saved_at: new Date().toISOString(),
        maker: M.base.maker, spec_id: M.base.spec_id, material: M.base.material,
        gs_no: M.base.gsNo, install: M.base.install, variant: M.base.variant, mode: M.base.mode,
        lot_no: M.base.lot_no, qty: M.base.qty,
        dates: { start: M.base.d1 || '', end: M.base.d2 || M.base.d1 || '' },
        writer: M.base.writer, serial_range: M.base.serial, memo: M.base.memo,
        items, summary: summarize(items),
      };
    }
    function exportJSON() {
      const rec = buildRecord();
      const name = `자체검사_${rec.maker || '업체'}_${rec.lot_no || '로트'}_${(rec.dates.start || fmtToday()).replace(/-/g, '')}_${rec.spec_id}.json`;
      const blob = new Blob([JSON.stringify(rec, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
    }
    function loadRecord(rec) {
      if (!rec || !rec.spec_id) { alert('제조사 자체검사 기록 파일이 아닙니다.'); return; }
      const sp = SPECS.find(s => s.id === rec.spec_id);
      if (!sp) { alert('알 수 없는 품목입니다: ' + rec.spec_id); return; }
      M = { base: {}, items: {} };
      M.base = {
        maker: rec.maker || '', spec_id: rec.spec_id, material: sp.name, gsNo: sp.gsNo || '', install: sp.install || '',
        variant: rec.variant || sp.variants[0].value, mode: rec.mode || '',
        lot_no: rec.lot_no || '', qty: Number(rec.qty) || 0,
        d1: (rec.dates || {}).start || '', d2: (rec.dates || {}).end || '',
        writer: rec.writer || '', serial: rec.serial_range || '', memo: rec.memo || '',
      };
      (rec.items || []).forEach(i => {
        M.items[i.key] = {
          checked: i.checked, defects: i.defects, jdg: i.jdg === '해당없음' ? '' : i.jdg,
          vals: i.vals || {}, sub: i.sub || '', date: i.date || '', note: i.note || '',
          dfType: (i.defect || {}).type || '', dfWhere: (i.defect || {}).where || '',
          dfPhenom: (i.defect || {}).phenom || '', dfCause: (i.defect || {}).cause || '',
          dfAction: (i.defect || {}).action || '', dfPrevent: (i.defect || {}).prevent || '',
        };
      });
      writeBase(M.base);
      startFlow();
    }

    // ===== 중간저장(브라우저) =====
    const DRAFT_KEY = 'mfr_draft_v1';
    let draftTimer = null;
    function saveDraft() {
      if (!M.base || !M.base.spec_id) return;
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ at: Date.now(), rec: buildRecord() })); } catch (e) { }
    }
    function saveDraftSoon() { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 700); }
    function getDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
    function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { } }
    function draftAge(ms) {
      const m = Math.floor((Date.now() - ms) / 60000);
      if (m < 1) return '방금 전'; if (m < 60) return m + '분 전';
      const h = Math.floor(m / 60); if (h < 24) return h + '시간 전';
      return Math.floor(h / 24) + '일 전';
    }
    function initDraftUI() {
      const d = getDraft();
      if (!d || !d.rec) return;
      $('draftCard').style.display = '';
      $('draftInfo').textContent =
        `${d.rec.maker || '업체미상'} · ${d.rec.material || ''} · 로트 ${d.rec.lot_no || '-'} · ${draftAge(d.at)} 자동저장`;
      $('btnDraftGo').onclick = () => { $('draftCard').style.display = 'none'; loadRecord(d.rec); };
      $('btnDraftDrop').onclick = () => { clearDraft(); $('draftCard').style.display = 'none'; };
    }

    // ===== 이벤트 =====
    $('fMaker').onchange = () => {
      $('wrapMakerEtc').style.display = $('fMaker').value === '__etc' ? '' : 'none';
    };
    $('fSpec').onchange = fillVariantSelect;
    $('btnStart').onclick = startFlow;
    $('btnBack').onclick = () => { if (activeStep > 0) { activeStep--; renderStep(); } };
    $('btnNext').onclick = () => {
      if (activeStep < stepDefs().length - 1) { activeStep++; renderStep(); } else showSummary();
    };
    $('btnSave').onclick = () => { saveDraft(); alert('브라우저에 중간저장했습니다.'); };
    $('btnSumBack').onclick = () => {
      activeStep = 0; $('secSum').classList.add('hidden'); $('secTest').classList.remove('hidden'); renderStep();
    };
    $('btnExport').onclick = exportJSON;
    $('btnPrint').onclick = () => window.print();
    $('btnLoad').onclick = () => $('fileLoad').click();
    $('fileLoad').onchange = e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { loadRecord(JSON.parse(r.result)); } catch (err) { alert('파일을 읽지 못했습니다: ' + err.message); } };
      r.readAsText(f, 'utf-8');
    };
    window.addEventListener('beforeunload', e => {
      if (M.base && M.base.spec_id) { saveDraft(); }
    });

    // ===== 초기화 =====
    fillMakerSelect(); fillSpecSelect(); fillVariantSelect();
    $('fD1').value = fmtToday(); $('fD2').value = fmtToday();
    initDraftUI();
  </script>
</body>

</html>
