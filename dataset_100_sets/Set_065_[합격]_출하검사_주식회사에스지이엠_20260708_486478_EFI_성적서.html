<!doctype html><html><head><meta charset="utf-8"><title>25.8kV 에폭시 고장구간 차단기(EFI) 시험성적서</title>
        <style>
          @page{size:A4;margin:12mm 10mm 12mm 10mm}
          html,body{margin:0;padding:0;font-family:"Malgun Gothic","맑은 고딕","나눔고딕",sans-serif;color:#000;font-size:11.5px}
          h1{text-align:center;font-size:20px;letter-spacing:10px;margin:0 0 8px;font-weight:bold}
          table{border-collapse:collapse}
          /* 갑지 헤더 */
          .hdr{width:100%;border:1.5px solid #000;margin-bottom:6px;border-collapse:collapse}
          .hdr td{border:1px solid #000;padding:5px 8px;font-size:11.5px;vertical-align:middle}
          .hdr td.lbl{font-weight:700;white-space:nowrap;background:#f5f5f5;width:90px}
          .hdr td.val{min-width:100px}
          .hdr td.lbl2{font-weight:700;white-space:nowrap;background:#f5f5f5;width:80px}
          .hdr td.val2{min-width:100px}
          /* 갑지 결과 표 */
          .res{width:100%;border:1.5px solid #000}
          .res th,.res td{border:1px solid #000;padding:5px 4px;text-align:center;vertical-align:middle}
          .res th{background:#e8e8e8;font-weight:bold;font-size:11.5px}
          .res td.item{text-align:left;white-space:pre-line;font-size:11px;padding:4px 6px}
          .res td.val{font-size:11.5px}
          /* 갑지 종합판정 */
          .foot{width:100%;margin-top:6px;border:1.5px solid #000}
          .foot td{border:1px solid #000;padding:6px 8px;vertical-align:middle}
          .foot td.jdg-good{color:#1565c0;font-weight:bold;font-size:14px;text-align:center}
          .foot td.jdg-bad{color:#c62828;font-weight:bold;font-size:14px;text-align:center}
          /* 을지 매트릭스 표 */
          .mx{width:100%;border:1.5px solid #000}
          .mx th,.mx td{border:1px solid #000;padding:4px 4px;text-align:center;font-size:10.5px;vertical-align:middle}
          .mx th{background:#e8e8e8;font-weight:bold;white-space:pre-line}
          .mx td.item{text-align:left;white-space:pre-line;font-size:10px;padding:3px 5px}
          .mx td.cert-row{text-align:left;font-size:10px;color:#555;padding:3px 5px}
          .mx .res-row td{font-weight:bold;background:#f0f0f0;font-size:11px}
          /* 페이지 나누기 */
          .pgbreak{page-break-before:always;break-before:page}
          /* 갑지 페이지 레이아웃: 헤더 위, 종합판정 아래 */
          .gapji-page{display:flex;flex-direction:column;min-height:257mm;box-sizing:border-box}
          .gapji-page>.res{margin-top:8px}
          .gapji-page>.foot{margin-top:auto}
          /* 판정 색상 */
          .good{color:#1565c0;font-weight:bold}
          .bad{color:#c62828;font-weight:bold}
          .na{color:#888}
          /* 워터마크 */
          .fixed-print-logo{position:fixed;bottom:4mm;right:4mm;z-index:-1;opacity:0.25;pointer-events:none}
          .fixed-print-logo img{height:28px;object-fit:contain}
        </style></head><body>
          <div class="fixed-print-logo">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAsUAAAHECAYAAADRf1cgAAEAAElEQVR4nOydd3wU1dfGn9leJoCAWBBFBXtXVBQbKIpiwa" style="height:28px;object-fit:contain">
          </div>
        </body></html>
