          ${R('.hdr td.lbl2','font-weight:700;white-space:nowrap;background:#eef4fc;width:80px')}
          ${R('.hdr td.val2','min-width:100px')}

    function headerTable(q){
      const dr=(q.test_dates.start===q.test_dates.end||!q.test_dates.end)?q.test_dates.start:`${q.test_dates.start} ~ ${q.test_dates.end}`;
      const range=(q.serial_start&&q.serial_end)?`${q.serial_start} ~ ${q.serial_end}`:(q.pool_list&&q.pool_list.length?`${q.pool_list[0]} ~ ${q.pool_list[q.pool_list.length-1]}`:'-');
      return `<table class="hdr">
        <tr><td class="l" colspan="4">${q.inspection_type==='면제검사'?'검사요청번호':'검사로트번호'} : ${q.lot_no||'-'}</td></tr>
        <tr><td class="l">품    명</td><td>: ${q.material}</td><td class="l">제 작 회 사</td><td>: ${q.maker||'-'}</td></tr>
        <tr><td class="l">규    격</td><td>: ${q.variant}</td><td class="l">시험년월일</td><td>: ${dr||'-'}</td></tr>
        <tr><td class="l">수    량</td><td>: ${q.qty} 대</td><td class="l">시  험  자</td><td>: ${q.attendants.tester||''} (서명)</td></tr>
        <tr><td class="l">제조번호</td><td>: ${range}</td><td class="l">시험입회자</td><td>: ${q.attendants.inspector||''} (서명)</td></tr>
      </table>`;
    }
    function serialRange(pool){
      if(!pool||!pool.length) return '-';
      if(pool.length===1) return pool[0];
      return pool[0]+' ~ '+pool[pool.length-1];
    }
    function gapjiHeaderTable(q){
      const td=(q.test_dates||{});
      const dateStr = td.start && td.end ? (td.start===td.end ? td.start : td.start+' ~ '+td.end) : (td.start||td.end||'-');
      const pool = q.pool_list||[];
      return `<table class="hdr">
        <tr><td class="lbl">검사로트번호</td><td class="val" colspan="3">${q.lot_no||'-'}</td></tr>
        <tr>
          <td class="lbl">품&nbsp;&nbsp;&nbsp;&nbsp;명</td><td class="val">${q.material||'-'}</td>
          <td class="lbl2">제작회사</td><td class="val2">${q.maker||'-'}</td>
        </tr>
        <tr>
          <td class="lbl">규&nbsp;&nbsp;&nbsp;&nbsp;격</td><td class="val">${q.variant||'-'}</td>
          <td class="lbl2">시험년월일</td><td class="val2">${dateStr}</td>
        </tr>
        <tr>
          <td class="lbl">수&nbsp;&nbsp;&nbsp;&nbsp;량</td><td class="val">${q.qty||0} 대</td>
          <td class="lbl2">시&nbsp;&nbsp;험&nbsp;&nbsp;자</td><td class="val2">${(q.attendants||{}).tester||'-'}&nbsp;&nbsp;(서명)</td>
        </tr>
        <tr>
          <td class="lbl">제조번호</td><td class="val">${serialRange(pool)}</td>
          <td class="lbl2">시험입회자</td><td class="val2">${(q.attendants||{}).inspector||'-'}&nbsp;&nbsp;(서명)</td>
        </tr>
      </table>`;
    }
    function gapjiItemVal(it){
      if(it.na) return '<span class="na">해당없음</span>';
      if(it.exempt) return '<span class="na">시험면제</span>';
      if(it.kind==='cert'){
        const dt=(it.cert||{}).date?`<br><span style="font-size:10px;color:#555">(${it.cert.date})</span>`:
                  ((it.cert||{}).submit==='미제출'?'<br><span style="color:#c00;font-size:10px">(미제출)</span>':'');
        return `<span style="font-size:10.5px">공인기관 성적서 대체, 별첨</span>${dt}`;
      }
      return jbP(it.jdg);
    }
    function gapjiHTML(q){
      const items=flatItems(q).filter(it=>!it.noGapji);   // 제출서류(핵심부품 등록서 등)는 갑지 제외
      const half=Math.ceil(items.length/2);
      const L=items.slice(0,half), R=items.slice(half);
      const rows=[]; for(let i=0;i<half;i++){
        const l=L[i], r=R[i];
        const lc = l?`<td class="item">${itemLabel(l)}</td><td class="val">${gapjiItemVal(l)}</td>`:'<td class="item"></td><td class="val"></td>';
        const rc = r?`<td class="item">${itemLabel(r)}</td><td class="val">${gapjiItemVal(r)}</td>`:'<td class="item"></td><td class="val"></td>';
        rows.push(`<tr>${lc}${rc}</tr>`);
      }
      const jdgTxt = (q.final||{}).judgement;
      const jdgDisplay = jdgTxt==='합격'?'시험합격':(jdgTxt||'-');
      const jdgClass = (jdgTxt==='합격')?'jdg-good':'jdg-bad';
      return `<div class="gapji-page"><div><h1>시  험  성  적  서</h1>${gapjiHeaderTable(q)}</div>
        <table class="res"><thead><tr><th style="width:33%">시험항목[기준]</th><th style="width:17%">결&nbsp;&nbsp;&nbsp;과</th><th style="width:33%">시험항목[기준]</th><th style="width:17%">결&nbsp;&nbsp;&nbsp;과</th></tr></thead>
        <tbody>${rows.join('')}</tbody></table>
        <table class="foot">
          <tr>
            <td style="text-align:left;width:60%">시험근거 : ${q.gsNo||'-'}<br>품질등급 : ${q.grade||'-'}</td>
            <td style="width:20%;text-align:center;font-weight:bold">종 합 판 정</td>
            <td style="width:20%" class="${jdgClass}">${jdgDisplay}</td>
          </tr>
          <tr>
            <td style="text-align:left;font-size:10.5px;color:#555">${(q.final||{}).remark||''}</td>
            <td colspan="2" style="text-align:center;font-weight:bold">한국전력공사</td>
          </tr>
        </table></div>`;
    }
    function euljiHTML(q){
      const serials=(q.pool_list&&q.pool_list.length)?q.pool_list:[];
      const items=flatItems(q).filter(it=>it.kind!=='cert' && it.kind!=='phaseConn' && !it.na && !it.noGapji); // 을지: 별첨(cert)·상연결접속재(항목단위)·자동형전용(해당없음)·제출서류 제외
      const PER_BLOCK=10, BLOCKS_PER_PAGE=2; // 블록당 10대, 페이지당 2블록(=20대)
      const blocks=[]; for(let i=0;i<serials.length;i+=PER_BLOCK) blocks.push(serials.slice(i,i+PER_BLOCK));
      if(!blocks.length) blocks.push([]);
      const blockHTML=(blk)=>{
        const head=`<tr><th style="width:26%">제조번호 \\ 시험항목</th>${blk.map(s=>`<th>${s}</th>`).join('')}</tr>`;
        const rows=items.map(it=>`<tr><td class="item">${itemLabel(it)}</td>${blk.map(sn=>`<td>${jbP(cellVal(it,sn))}</td>`).join('')}</tr>`).join('');
        const resRow=`<tr class="res-row"><td class="item">결    과</td>${blk.map(sn=>`<td>${jbP(serialResult(q,sn))}</td>`).join('')}</tr>`;
        return `<table class="mx"><thead>${head}</thead><tbody>${rows}${resRow}</tbody></table>`;
      };
      let out='';
      blocks.forEach((blk,bi)=>{
        if(bi>0 && bi%BLOCKS_PER_PAGE===0) out+='<div class="pgbreak"></div>';          // 2블록 초과 시 다음 페이지
        if(bi%BLOCKS_PER_PAGE===0) out+=`<h1>시 험 성 적 서</h1>${headerTable(q)}`;        // 페이지 첫 블록에 제목·헤더
        out+=blockHTML(blk);
        if(bi%BLOCKS_PER_PAGE!==BLOCKS_PER_PAGE-1) out+='<div style="height:12px"></div>';  // 페이지 내 블록 간격
      });
      return out;
    }

    // ===== 시트/페이지 분리 출력을 위한 공통 헬퍼 =====
    // 별첨(공인기관 성적서 대체) 항목 목록
    function certItemsList(q) {
      const out = [];
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => { if (it.kind === 'cert' && !it.na) out.push(it); });
      });
      return out;
    }
    // 주회로 저항 등 상세 실측값(fields)을 갖는 항목 목록
    function resistanceItemsList(q) {
      const out = [];
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => { if (it.kind === 'resistance' && !it.na) out.push(it); });
      });
      return out;
    }
    // 상연결 접속재(A·B·C상 각 3개소 실측) 항목 목록
    function phaseConnItemsList(q) {
      const out = [];
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => { if (it.kind === 'phaseConn' && !it.na) out.push(it); });
      });
      return out;
    }
    // 부분방전(인가부분별 측정) 항목 목록
    function pdPhaseItemsList(q) {
      const out = [];
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => { if (it.kind === 'pdPhase' && !it.na) out.push(it); });
      });
      return out;
    }
    // 부분방전 실측값 시트 (제조번호 × 인가부분)
    function pdPhaseHTML(it, q) {
      const serials = (it.serials || []).filter(sn => (it.res || {})[sn]);
      if (!serials.length) return '';
      const rows = it.shield ? PD_ROWS.filter(r => r.grp === '대지간') : PD_ROWS;
      const u = it.unit || 'pC';
      const head = `<tr><th style="width:14%">구분</th><th style="width:20%">인가부분</th>${serials.map(sn => `<th>${sn}</th>`).join('')}</tr>`;
      const body = rows.map(rw => `<tr><td>${rw.grp}</td><td class="item">${rw.lab}</td>${serials.map(sn => {
        const v = (((it.res || {})[sn] || {}).fields || {})[rw.k];
        return `<td>${(v === undefined || v === null || v === '') ? '-' : v}</td>`;
      }).join('')}</tr>`).join('');
      const resRow = `<tr class="res-row"><td class="item" colspan="2">결&nbsp;&nbsp;&nbsp;&nbsp;과</td>${serials.map(sn => `<td>${jbP(((it.res || {})[sn] || {}).jdg || '-')}</td>`).join('')}</tr>`;
      return `<div class="pgbreak"></div>
        <div class="gapji-page" style="padding:10mm;background:#fff">
          <h1>${it.name}</h1>
          <div style="font-size:10.5px;color:#555;margin-bottom:8px;text-align:center">
            ${it.crit ? ('판정기준 : ' + it.crit + ' (단위 ' + u + ')') : ''}${it.shield ? ' · 하우징 실드 처리로 상간 측정 생략' : ''}</div>
          <table class="mx"><thead>${head}</thead><tbody>${body}${resRow}</tbody></table>
        </div>`;
    }
    // 상연결 접속재 실측값 시트 (9칸 두께 + 최소값 + 판정)
    function phaseConnHTML(it, q) {
      const ph = it.phase || {};
      const vals = ['A','B','C'].flatMap(p => (ph[p] || [])).filter(v => v !== '' && v !== undefined && isFinite(Number(v))).map(Number);
      if (!vals.length) return '';
      const mn = Math.min(...vals);
      const u = it.unit || '';
      const head = `<tr><th style="width:22%">상 \\ 측정개소</th><th>1개소</th><th>2개소</th><th>3개소</th></tr>`;
      const body = ['A','B','C'].map(p => `<tr><td class="item">${p}상</td>${[0,1,2].map(i => {
        const v = (ph[p] || [])[i];
        return `<td>${(v === undefined || v === null || v === '') ? '-' : v}</td>`;
      }).join('')}</tr>`).join('');
      const resRow = `<tr class="res-row"><td class="item">최소두께 / 판정</td><td>${mn}${u}</td><td colspan="2">${jbP(it.jdg || '-')}</td></tr>`;
      return `<div class="pgbreak"></div>
        <div class="gapji-page" style="padding:10mm;background:#fff">
          <h1>${it.name}</h1>
          <div style="font-size:10.5px;color:#555;margin-bottom:8px;text-align:center">${it.crit ? ('판정기준 : ' + it.crit) : ''}</div>
          <table class="mx"><thead>${head}</thead><tbody>${body}${resRow}</tbody></table>
        </div>`;
    }
    // 저항측정 항목의 제조번호별 실측 필드(A상/B상/C상 등) 목록 산출 (기록된 데이터 기반)
    function resistanceFieldSet(it, serials) {
      const fieldSet = [];
      serials.forEach(sn => {
        const f = ((it.res || {})[sn] || {}).fields || {};
        Object.keys(f).forEach(k => { if (!fieldSet.includes(k)) fieldSet.push(k); });
      });
      return fieldSet;
    }
    // Excel 시트명 안전 변환(중복/금지문자/31자 제한 처리)
    function safeSheetName(name, used) {
      let s = String(name || '시트').replace(/[\\\/\?\*\[\]:]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!s) s = '시트';
      if (s.length > 31) s = s.slice(0, 31).trim();
      let base = s, i = 2, finalName = s;
      while (used.has(finalName)) {
        const suffix = '_' + i;
        finalName = base.slice(0, 31 - suffix.length) + suffix;
        i++;
      }
      used.add(finalName);
      return finalName;
    }

    function resistanceHTML(it, q) {
      const pool = q.pool_list || [];
      const serials = pool.filter(sn => it.res && it.res[sn]);
      if (!serials.length) return '';
      const fieldSet = resistanceFieldSet(it, serials);
      const headRow = `<tr><th style="width:22%">제조번호 \\ 측정항목</th>${serials.map(sn => `<th>${sn}</th>`).join('')}</tr>`;
      const bodyRows = fieldSet.map(fk => `<tr><td class="item">${fk}</td>${serials.map(sn => {
        const v = ((it.res[sn] || {}).fields || {})[fk];
        return `<td>${(v === undefined || v === null || v === '') ? '-' : v}</td>`;
      }).join('')}</tr>`).join('');
      const resRow = `<tr class="res-row"><td class="item">결&nbsp;&nbsp;&nbsp;&nbsp;과</td>${serials.map(sn => `<td>${jbP((it.res[sn] || {}).jdg || '-')}</td>`).join('')}</tr>`;
      return `<div class="pgbreak"></div>
        <div class="gapji-page" style="padding:10mm;background:#fff">
          <h1>${it.name}</h1>
          <div style="font-size:10.5px;color:#555;margin-bottom:8px;text-align:center">${it.crit ? ('판정기준 : ' + it.crit) : ''}</div>
          <table class="mx"><thead>${headRow}</thead><tbody>${bodyRows}${resRow}</tbody></table>
        </div>`;
    }

    function attachmentsHTML(q) {
      let out = '';

      // 1) 주회로 저항 등 상세 실측값 시트/페이지 (항목별로 분리)
      resistanceItemsList(q).forEach(it => { out += resistanceHTML(it, q); });

      // 1-2) 부분방전 인가부분별 실측값 시트
      pdPhaseItemsList(q).forEach(it => { out += pdPhaseHTML(it, q); });

      // 1-3) 상연결 접속재 두께 실측값 시트 (A·B·C상 각 3개소)
      phaseConnItemsList(q).forEach(it => { out += phaseConnHTML(it, q); });

      // 2) 별첨(공인기관 성적서 대체) 항목별 시트/페이지 (항목마다 분리, 항목명으로 표제)
      certItemsList(q).forEach(it => {
        const files = it.certFiles || [];
        if (!files.length) {
          out += `<div class="pgbreak"></div>
          <div class="gapji-page" style="padding:10mm;background:#fff">
            <h1>${it.name}</h1>
            <div style="border:1px solid #000;padding:8px 12px;margin-top:10px;margin-bottom:12px;font-size:9.5pt;background:#f8fafc;display:flex;justify-content:space-between;align-items:center">
              <span><b>판정기준:</b> ${it.crit || '-'}</span>
              <span><b>제출여부:</b> ${(it.cert||{}).submit || '미제출'}</span>
              <span><b>제출일자:</b> ${(it.cert||{}).date || '-'}</span>
            </div>
            <div style="text-align:center;margin-top:40px;color:#888">첨부된 파일이 없습니다.</div>
          </div>`;
          return;
        }
        files.forEach((file, fi) => {
          out += `<div class="pgbreak"></div>
          <div class="gapji-page" style="padding:10mm;background:#fff">
            <h1>${it.name}${files.length > 1 ? ` (${fi + 1}/${files.length})` : ''}</h1>
            <div style="border:1px solid #000;padding:8px 12px;margin-top:10px;margin-bottom:12px;font-size:9.5pt;background:#f8fafc;display:flex;justify-content:space-between;align-items:center">
              <span><b>판정기준:</b> ${it.crit || '-'}</span>
              <span><b>제출일자:</b> ${(it.cert||{}).date || '-'}</span>
              <span><b>파일명:</b> ${file.name}</span>
            </div>
            <div style="text-align:center;margin-top:10px">`;
          if (file.type && file.type.includes('pdf')) {
            out += `<object data="${file.dataUrl}" type="application/pdf" style="width:100%;height:820px;border:1px solid #cbd5e1">
              <embed src="${file.dataUrl}" type="application/pdf" style="width:100%;height:820px" />
              <p style="padding:20px">PDF를 직접 브라우저에 표시할 수 없습니다. <a href="${file.dataUrl}" target="_blank" style="color:#2563eb;font-weight:bold">여기를 클릭하여 PDF 열기</a></p>
            </object>`;
          } else {
            out += `<img src="${file.dataUrl}" style="max-width:100%;max-height:820px;border:1px solid #cbd5e1;object-fit:contain">`;
          }
          out += `</div></div>`;
        });
      });

      // 3) 시험 사진대지
      const shotPhotos = (q.photos || []).filter(p => p && p.dataUrl);   // 빈 슬롯은 사진대지에서 제외
      if (shotPhotos.length > 0) {
        out += `<div class="pgbreak"></div>
        <div class="gapji-page" style="padding:10mm;background:#fff">
          <h1>시 험 사 진 대 지</h1>
          ${headerTable(q)}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px">`;
        shotPhotos.forEach((p, idx) => {
          out += `<div style="border:1px solid #cbd5e1;padding:8px;text-align:center;background:#fff;border-radius:4px">
            <div style="font-weight:bold;margin-bottom:6px;font-size:9.5pt;color:#1e293b">[사진 ${idx+1}] ${p.caption || '시험 진행 사진'}</div>
            <img src="${p.dataUrl}" style="max-width:100%;max-height:260px;object-fit:contain">
          </div>`;
        });
        out += `</div></div>`;
      }

      return out;
    }

    function cellValForQIR(it, sn) {
      const res = it.res || {};
      const vObj = res[sn];
      if (!vObj) return '-';
      if (typeof vObj === 'object') {
        if (vObj.val !== undefined && vObj.val !== null) return vObj.val;
        if (vObj.jdg) return vObj.jdg;
      }
      return vObj || '-';
    }

    function serialResultForQIR(q, sn) {
      let fail = false;
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => {
          if (!it.na && !it.exempt && it.res && it.res[sn]) {
            const r = it.res[sn];
            if ((typeof r === 'object' && r.jdg === '불량') || r === '불량') fail = true;
          }
        });
      });
      return fail ? '불량' : '양호';
    }

    // 엑셀 서식 공통 팔레트 (PDF 리포트 CSS와 동일 톤으로 통일 - reportStyles() 참고)
    const XLS_COLOR = {
      title: 'FF0D47A1', good: 'FF1565C0', bad: 'FFC62828', gray: 'FF888888',
      headerBg: 'FFDDE9F8', labelBg: 'FFEEF4FC', goodBg: 'FFEEF5FF', badBg: 'FFFDEEEE',
      zebraBg: 'FFF7FAFD', resultBg: 'FFEEF1F6'
    };
    const XLS_THIN = { style: 'thin', color: { argb: 'FF000000' } };
    const XLS_BORDER_ALL = { top: XLS_THIN, left: XLS_THIN, bottom: XLS_THIN, right: XLS_THIN };
    // 셀 하나에 폰트/배경/테두리/정렬을 한 번에 적용하는 헬퍼 (병합 셀은 반드시 mergeCells() 호출 "후"
    // 앵커(좌상단) 셀에 대해 호출해야 스타일이 병합 범위 전체에 반영됨)
    function xlsStyle(cell, opts = {}) {
      cell.font = Object.assign(
        { name: 'Malgun Gothic', size: opts.size || 10.5 },
        opts.bold ? { bold: true } : {},
        opts.color ? { color: { argb: opts.color } } : {}
      );
      cell.alignment = { vertical: 'middle', wrapText: opts.wrap !== false, horizontal: opts.align || 'center' };
      if (opts.border !== false) cell.border = XLS_BORDER_ALL;
      if (opts.bg) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: opts.bg } };
    }
    // 판정값(양호/불량 등)에 따른 강조색 - PDF의 jbP()와 동일 기준
    function xlsJudgeStyle(v) {
      if (v === '불량' || v === '불합격' || v === '불합격(중도종료)') return { color: XLS_COLOR.bad, bold: true };
      if (v === '시험중단') return { color: XLS_COLOR.gray };
      return {};
    }

    async function exportToExcel(q) {
      if (typeof ExcelJS === 'undefined') {
        alert('ExcelJS 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인하거나 CDN 링크를 확인하세요.');
        return;
      }
      const wb = new ExcelJS.Workbook();
      wb.creator = 'KEPCO 개폐기류 성적서 작성 프로그램';
      wb.created = new Date();

      const pool = q.pool_list || [];
      const td = q.test_dates || {};
      const dateStr = td.start && td.end ? (td.start === td.end ? td.start : td.start + ' ~ ' + td.end) : (td.start || td.end || '');
      const printMargins = { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.3, footer: 0.3 };

      // ====== 1. 갑지 Sheet (한전 실물 성적서 갑지와 동일한 병합 셀/테두리/음영 서식) ======
      const wsGapji = wb.addWorksheet('갑지', {
        pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins }
      });
      wsGapji.columns = [{ width: 32 }, { width: 15 }, { width: 32 }, { width: 15 }];

      wsGapji.mergeCells('A1:D1');
      const gTitle = wsGapji.getCell('A1');
      gTitle.value = '시  험  성  적  서';
      xlsStyle(gTitle, { bold: true, size: 20, color: XLS_COLOR.title, align: 'center', border: false });
      gTitle.border = { bottom: { style: 'medium', color: { argb: XLS_COLOR.title } } };
      wsGapji.getRow(1).height = 32;

      const metaRowsG = [
        ['검사로트번호', q.lot_no || '-', null, null],
        ['품    명', q.material || '-', '제작회사', q.maker || '-'],
        ['규    격', q.variant || '-', '시험년월일', dateStr || '-'],
        ['수    량', (q.qty || 0) + ' 대', '시  험  자', (q.attendants || {}).tester || '-'],
        ['제조번호', serialRange(pool), '시험입회자', (q.attendants || {}).inspector || '-']
      ];
      let r = 2;
      metaRowsG.forEach((row, idx) => {
        if (idx === 0) wsGapji.mergeCells(`B${r}:D${r}`);
        const rr = wsGapji.getRow(r);
        xlsStyle(rr.getCell(1), { bold: true, bg: XLS_COLOR.labelBg }); rr.getCell(1).value = row[0];
        xlsStyle(rr.getCell(2), { align: 'left' }); rr.getCell(2).value = row[1];
        if (idx !== 0) {
          xlsStyle(rr.getCell(3), { bold: true, bg: XLS_COLOR.labelBg }); rr.getCell(3).value = row[2];
          xlsStyle(rr.getCell(4), { align: 'left' }); rr.getCell(4).value = row[3];
        }
        rr.height = 20;
        r++;
      });

      r++; // 여백용 빈 행 (테두리 없음)

      const hdrRowG = wsGapji.getRow(r);
      ['시험항목[기준]', '결   과', '시험항목[기준]', '결   과'].forEach((t, i) => {
        xlsStyle(hdrRowG.getCell(i + 1), { bold: true, bg: XLS_COLOR.headerBg }); hdrRowG.getCell(i + 1).value = t;
      });
      hdrRowG.height = 20;
      r++;

      const allItems = [];
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => {
          if (it.noGapji) return;                       // 제출서류는 갑지 시트 제외(별도 시트로 출력)
          let resVal;
          if (it.na) resVal = '해당없음';
          else if (it.exempt) resVal = '시험면제';
          else if (it.kind === 'cert') {
            const dt = (it.cert || {}).date || '';
            resVal = '공인기관 성적서 대체, 별첨' + (dt ? ' (' + dt + ')' : '');
          }
          else resVal = it.jdg || '-';
          allItems.push([it.name + (it.crit ? ' [' + it.crit + ']' : ''), resVal]);
        });
      });
      const half = Math.ceil(allItems.length / 2);
      for (let i = 0; i < half; i++) {
        const l = allItems[i] || ['', ''];
        const rItem = allItems[i + half] || ['', ''];
        const row = wsGapji.getRow(r);
        xlsStyle(row.getCell(1), { align: 'left', size: 9.5 }); row.getCell(1).value = l[0];
        xlsStyle(row.getCell(2), Object.assign({ size: 9.5 }, xlsJudgeStyle(l[1]))); row.getCell(2).value = l[1];
        xlsStyle(row.getCell(3), { align: 'left', size: 9.5 }); row.getCell(3).value = rItem[0];
        xlsStyle(row.getCell(4), Object.assign({ size: 9.5 }, xlsJudgeStyle(rItem[1]))); row.getCell(4).value = rItem[1];
        row.height = 26;
        r++;
      }

      const jdgTxt = (q.final || {}).judgement;
      const jdgDisplay = jdgTxt === '합격' ? '시험합격' : (jdgTxt || '-');
      const isGood = jdgTxt === '합격';
      wsGapji.mergeCells(`A${r}:B${r}`);
      const footRow1 = wsGapji.getRow(r);
      xlsStyle(footRow1.getCell(1), { align: 'left', size: 9.5 });
      footRow1.getCell(1).value = `시험근거 : ${q.gsNo || '-'}\n품질등급 : ${q.grade || '-'}`;
      xlsStyle(footRow1.getCell(3), { bold: true }); footRow1.getCell(3).value = '종 합 판 정';
      xlsStyle(footRow1.getCell(4), { bold: true, size: 13, color: isGood ? XLS_COLOR.good : XLS_COLOR.bad, bg: isGood ? XLS_COLOR.goodBg : XLS_COLOR.badBg });
      footRow1.getCell(4).value = jdgDisplay;
      footRow1.height = 32;
      r++;
      wsGapji.mergeCells(`A${r}:B${r}`);
      wsGapji.mergeCells(`C${r}:D${r}`);
      const footRow2 = wsGapji.getRow(r);
      xlsStyle(footRow2.getCell(1), { align: 'left', size: 9, color: XLS_COLOR.gray });
      footRow2.getCell(1).value = (q.final || {}).remark || '';
      xlsStyle(footRow2.getCell(3), { bold: true }); footRow2.getCell(3).value = '한국전력공사';
      footRow2.height = 20;

      // ====== 2. 을지 Sheet (제조번호 매트릭스) ======
      const itemsForEulji = [];
      Object.values(q.results || {}).forEach(grp => {
        (grp.items || []).forEach(it => { if (!it.na && it.kind !== 'phaseConn' && !it.noGapji) itemsForEulji.push(it); });
      });
      const nCols = 1 + Math.max(pool.length, 1);
      const wsEulji = wb.addWorksheet('을지', {
        pageSetup: {
          orientation: pool.length > 6 ? 'landscape' : 'portrait',
          fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins
        }
      });
      wsEulji.getColumn(1).width = 30;
      pool.forEach((_, i) => { wsEulji.getColumn(i + 2).width = 11; });

      wsEulji.mergeCells(1, 1, 1, nCols);
      const eTitle = wsEulji.getCell(1, 1);
      eTitle.value = '시  험  성  적  서';
      xlsStyle(eTitle, { bold: true, size: 18, color: XLS_COLOR.title, border: false });
      eTitle.border = { bottom: { style: 'medium', color: { argb: XLS_COLOR.title } } };
      wsEulji.getRow(1).height = 28;

      let er = 3; // 2행은 여백
      const eHdr = wsEulji.getRow(er);
      xlsStyle(eHdr.getCell(1), { bold: true, bg: XLS_COLOR.headerBg, size: 9 }); eHdr.getCell(1).value = '제조번호 \\ 시험항목';
      pool.forEach((sn, i) => { xlsStyle(eHdr.getCell(i + 2), { bold: true, bg: XLS_COLOR.headerBg }); eHdr.getCell(i + 2).value = sn; });
      eHdr.height = 22;
      er++;

      itemsForEulji.forEach((it, idx) => {
        const zebra = idx % 2 === 1 ? XLS_COLOR.zebraBg : null;
        const row = wsEulji.getRow(er);
        if (it.kind === 'cert') {
          if (nCols > 2) wsEulji.mergeCells(er, 2, er, nCols);
          xlsStyle(row.getCell(1), { align: 'left', size: 9, bg: zebra }); row.getCell(1).value = it.name + (it.crit ? ' [' + it.crit + ']' : '');
          const dt = (it.cert || {}).date || '';
          xlsStyle(row.getCell(2), { size: 9, color: XLS_COLOR.gray, bg: zebra }); row.getCell(2).value = '공인기관 성적서 대체, 별첨' + (dt ? ' (' + dt + ')' : '');
        } else {
          xlsStyle(row.getCell(1), { align: 'left', size: 9, bg: zebra }); row.getCell(1).value = it.name + (it.crit ? ' [' + it.crit + ']' : '');
          pool.forEach((sn, i) => {
            const rv = (it.res || {})[sn];
            let v;
            if (!rv) v = '-';
            else if (rv.val !== undefined && rv.val !== null && rv.val !== '') v = rv.val;
            else v = rv.jdg || '-';
            xlsStyle(row.getCell(i + 2), Object.assign({ size: 9.5, bg: zebra }, xlsJudgeStyle(v)));
            row.getCell(i + 2).value = v;
          });
        }
        row.height = 20;
        er++;
      });

      const resRowE = wsEulji.getRow(er);
      xlsStyle(resRowE.getCell(1), { bold: true, bg: XLS_COLOR.resultBg }); resRowE.getCell(1).value = '결    과';
      pool.forEach((sn, i) => {
        const v = serialResultForQIR(q, sn);
        xlsStyle(resRowE.getCell(i + 2), Object.assign({ bold: true, bg: XLS_COLOR.resultBg }, xlsJudgeStyle(v)));
        resRowE.getCell(i + 2).value = v;
      });
      resRowE.height = 22;

      // 시트명 중복 방지용 (한전 예시 양식과 동일하게 '갑지','을지'는 먼저 선점)
      const usedSheetNames = new Set(['갑지', '을지']);

      // ====== 3. 주회로 저항 등 상세 실측값 Sheet (항목별로 분리) ======
      resistanceItemsList(q).forEach(it => {
        const serials = pool.filter(sn => it.res && it.res[sn]);
        if (!serials.length) return;
        const fieldSet = resistanceFieldSet(it, serials);
        const ws = wb.addWorksheet(safeSheetName(it.name, usedSheetNames), {
          pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins }
        });
        ws.getColumn(1).width = 20;
        serials.forEach((_, i) => { ws.getColumn(i + 2).width = 11; });
        ws.mergeCells(1, 1, 1, serials.length + 1);
        xlsStyle(ws.getCell(1, 1), { bold: true, size: 13, color: XLS_COLOR.title, border: false });
        ws.getCell(1, 1).value = it.name + (it.crit ? ' [' + it.crit + ']' : '');
        const hr = ws.getRow(2);
        xlsStyle(hr.getCell(1), { bold: true, bg: XLS_COLOR.headerBg }); hr.getCell(1).value = '제조번호';
        serials.forEach((sn, i) => { xlsStyle(hr.getCell(i + 2), { bold: true, bg: XLS_COLOR.headerBg }); hr.getCell(i + 2).value = sn; });
        let rr = 3;
        fieldSet.forEach(fk => {
          const row = ws.getRow(rr);
          xlsStyle(row.getCell(1), { align: 'left', size: 9.5 }); row.getCell(1).value = fk;
          serials.forEach((sn, i) => {
            const v = ((it.res[sn] || {}).fields || {})[fk];
            xlsStyle(row.getCell(i + 2), { size: 9.5 });
            row.getCell(i + 2).value = (v === undefined || v === null || v === '') ? '-' : v;
          });
          rr++;
        });
        const resRow = ws.getRow(rr);
        xlsStyle(resRow.getCell(1), { bold: true, bg: XLS_COLOR.resultBg }); resRow.getCell(1).value = '결    과';
        serials.forEach((sn, i) => {
          const v = (it.res[sn] || {}).jdg || '-';
          xlsStyle(resRow.getCell(i + 2), Object.assign({ bold: true, bg: XLS_COLOR.resultBg }, xlsJudgeStyle(v)));
          resRow.getCell(i + 2).value = v;
        });
      });

      // ====== 3-2. 부분방전 인가부분별 실측값 Sheet ======
      pdPhaseItemsList(q).forEach(it => {
        const serials = pool.filter(sn => it.res && it.res[sn]);
        if (!serials.length) return;
        const rows = it.shield ? PD_ROWS.filter(r => r.grp === '대지간') : PD_ROWS;
        const ws = wb.addWorksheet(safeSheetName(it.name, usedSheetNames), {
          pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins }
        });
        ws.getColumn(1).width = 10; ws.getColumn(2).width = 16;
        serials.forEach((_, i) => { ws.getColumn(i + 3).width = 11; });
        ws.mergeCells(1, 1, 1, serials.length + 2);
        xlsStyle(ws.getCell(1, 1), { bold: true, size: 13, color: XLS_COLOR.title, border: false });
        ws.getCell(1, 1).value = it.name + (it.crit ? ' [' + it.crit + ']' : '') + (it.shield ? ' · 하우징 실드 처리(상간 측정 생략)' : '');
        const hr = ws.getRow(2);
        ['구분', '인가부분'].forEach((t, i) => { xlsStyle(hr.getCell(i + 1), { bold: true, bg: XLS_COLOR.headerBg }); hr.getCell(i + 1).value = t; });
        serials.forEach((sn, i) => { xlsStyle(hr.getCell(i + 3), { bold: true, bg: XLS_COLOR.headerBg }); hr.getCell(i + 3).value = sn; });
        let rr = 3;
        rows.forEach(rw => {
          const row = ws.getRow(rr);
          xlsStyle(row.getCell(1), { size: 9.5 }); row.getCell(1).value = rw.grp;
          xlsStyle(row.getCell(2), { align: 'left', size: 9.5 }); row.getCell(2).value = rw.lab;
          serials.forEach((sn, i) => {
            const v = ((it.res[sn] || {}).fields || {})[rw.k];
            xlsStyle(row.getCell(i + 3), { size: 9.5 });
            row.getCell(i + 3).value = (v === undefined || v === null || v === '') ? '-' : v;
          });
          rr++;
        });
        const resRow = ws.getRow(rr);
        ws.mergeCells(rr, 1, rr, 2);
        xlsStyle(resRow.getCell(1), { bold: true, bg: XLS_COLOR.resultBg }); resRow.getCell(1).value = '결    과';
        serials.forEach((sn, i) => {
          const v = (it.res[sn] || {}).jdg || '-';
          xlsStyle(resRow.getCell(i + 3), Object.assign({ bold: true, bg: XLS_COLOR.resultBg }, xlsJudgeStyle(v)));
          resRow.getCell(i + 3).value = v;
        });
      });

      // ====== 3-3. 상연결 접속재 두께 실측값 Sheet (A·B·C상 각 3개소) ======
      phaseConnItemsList(q).forEach(it => {
        const ph = it.phase || {};
        const vals = ['A', 'B', 'C'].flatMap(p => (ph[p] || [])).filter(v => v !== '' && v !== undefined && isFinite(Number(v))).map(Number);
        if (!vals.length) return;
        const ws = wb.addWorksheet(safeSheetName(it.name, usedSheetNames), {
          pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins }
        });
        ws.getColumn(1).width = 16;
        [2, 3, 4].forEach(c => { ws.getColumn(c).width = 13; });
        ws.mergeCells(1, 1, 1, 4);
        xlsStyle(ws.getCell(1, 1), { bold: true, size: 13, color: XLS_COLOR.title, border: false });
        ws.getCell(1, 1).value = it.name + (it.crit ? ' [' + it.crit + ']' : '');
        const hr = ws.getRow(2);
        ['상 \\ 측정개소', '1개소', '2개소', '3개소'].forEach((t, i) => {
          xlsStyle(hr.getCell(i + 1), { bold: true, bg: XLS_COLOR.headerBg }); hr.getCell(i + 1).value = t;
        });
        let rr = 3;
        ['A', 'B', 'C'].forEach(p => {
          const row = ws.getRow(rr);
          xlsStyle(row.getCell(1), { bold: true, bg: XLS_COLOR.headerBg }); row.getCell(1).value = p + '상';
          [0, 1, 2].forEach(i => {
            const v = (ph[p] || [])[i];
            xlsStyle(row.getCell(i + 2), { size: 9.5 });
            row.getCell(i + 2).value = (v === undefined || v === null || v === '') ? '-' : Number(v);
          });
          rr++;
        });
        const resRow = ws.getRow(rr);
        xlsStyle(resRow.getCell(1), { bold: true, bg: XLS_COLOR.resultBg }); resRow.getCell(1).value = '최소두께 / 판정';
        xlsStyle(resRow.getCell(2), { bold: true, bg: XLS_COLOR.resultBg }); resRow.getCell(2).value = Math.min(...vals);
        ws.mergeCells(rr, 3, rr, 4);
        xlsStyle(resRow.getCell(3), Object.assign({ bold: true, bg: XLS_COLOR.resultBg }, xlsJudgeStyle(it.jdg || '-')));
        resRow.getCell(3).value = it.jdg || '-';
      });

      // ====== 4. 별첨(공인기관 성적서 대체) 항목별 Sheet (항목마다 분리) ======
      certItemsList(q).forEach(it => {
        const files = it.certFiles || [];
        const ws = wb.addWorksheet(safeSheetName(it.name, usedSheetNames), { pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins } });
        ws.getColumn(1).width = 10; ws.getColumn(2).width = 40; ws.getColumn(3).width = 16;
        ws.mergeCells(1, 1, 1, 3);
        xlsStyle(ws.getCell(1, 1), { bold: true, size: 13, color: XLS_COLOR.title, border: false });
        ws.getCell(1, 1).value = it.name + (it.crit ? ' [' + it.crit + ']' : '');
        const metaLines = [
          ['판정기준', it.crit || '-'],
          ['제출여부', (it.cert || {}).submit || '미제출'],
          ['제출일자', (it.cert || {}).date || '-'],
          ['발취/주기', it.samp || it.cycle || '-']
        ];
        let rr = 2;
        metaLines.forEach(([k, v]) => {
          ws.mergeCells(rr, 2, rr, 3);
          const row = ws.getRow(rr);
          xlsStyle(row.getCell(1), { bold: true, bg: XLS_COLOR.labelBg }); row.getCell(1).value = k;
          xlsStyle(row.getCell(2), { align: 'left' }); row.getCell(2).value = v;
          rr++;
        });
        rr++;
        const hdr2 = ws.getRow(rr);
        ['연번', '첨부파일명', '파일형식'].forEach((t, i) => { xlsStyle(hdr2.getCell(i + 1), { bold: true, bg: XLS_COLOR.headerBg }); hdr2.getCell(i + 1).value = t; });
        rr++;
        const fileRows = files.length ? files.map((f, idx) => [idx + 1, f.name || '-', f.type || '-']) : [['-', '첨부파일 없음', '-']];
        fileRows.forEach(fr => {
          const row = ws.getRow(rr);
          [1, 2, 3].forEach(ci => xlsStyle(row.getCell(ci), { align: ci === 2 ? 'left' : 'center' }));
          row.getCell(1).value = fr[0]; row.getCell(2).value = fr[1]; row.getCell(3).value = fr[2];
          rr++;
        });
        rr++;
        ws.mergeCells(rr, 1, rr, 3);
        xlsStyle(ws.getCell(rr, 1), { align: 'left', size: 9, color: XLS_COLOR.gray, border: false });
        ws.getCell(rr, 1).value = '※ 첨부 이미지/PDF 원본은 PDF 출력물에서 확인할 수 있습니다.';
      });

      // ====== 5. 시험 사진대지 Sheet ======
      {
        const ws = wb.addWorksheet(safeSheetName('사진대지', usedSheetNames), { pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins } });
        ws.getColumn(1).width = 8; ws.getColumn(2).width = 36; ws.getColumn(3).width = 20;
        const hdr = ws.getRow(1);
        ['연번', '캡션', '비고'].forEach((t, i) => { xlsStyle(hdr.getCell(i + 1), { bold: true, bg: XLS_COLOR.headerBg }); hdr.getCell(i + 1).value = t; });
        const photos = q.photos || [];
        const photoRows = photos.length ? photos.map((p, idx) => [idx + 1, p.caption || '시험 진행 사진', '']) : [['-', '첨부된 사진 없음', '']];
        let rr = 2;
        photoRows.forEach(pr => {
          const row = ws.getRow(rr);
          [1, 2, 3].forEach(ci => xlsStyle(row.getCell(ci), { align: ci === 2 ? 'left' : 'center' }));
          row.getCell(1).value = pr[0]; row.getCell(2).value = pr[1]; row.getCell(3).value = pr[2];
          rr++;
        });
        rr++;
        ws.mergeCells(rr, 1, rr, 3);
        xlsStyle(ws.getCell(rr, 1), { align: 'left', size: 9, color: XLS_COLOR.gray, border: false });
        ws.getCell(rr, 1).value = '※ 실제 사진 이미지는 PDF 출력물의 "시험사진대지" 페이지에서 확인할 수 있습니다.';
      }

      // ====== 6. 시료 리스트 Sheet ======
      {
        const ws = wb.addWorksheet(safeSheetName('시료 리스트', usedSheetNames), { pageSetup: { orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: printMargins } });
        ws.getColumn(1).width = 8; ws.getColumn(2).width = 22; ws.getColumn(3).width = 12; ws.getColumn(4).width = 12;
        const hdr = ws.getRow(1);
        ['연번', '제조번호 (Serial)', '품질등급', '개별 판정'].forEach((t, i) => { xlsStyle(hdr.getCell(i + 1), { bold: true, bg: XLS_COLOR.headerBg }); hdr.getCell(i + 1).value = t; });
        pool.forEach((sn, idx) => {
          const v = serialResultForQIR(q, sn);
          const row = ws.getRow(idx + 2);
          [1, 2, 3].forEach(ci => xlsStyle(row.getCell(ci), {}));
          xlsStyle(row.getCell(4), Object.assign({ bold: true }, xlsJudgeStyle(v)));
          row.getCell(1).value = idx + 1; row.getCell(2).value = sn; row.getCell(3).value = q.grade || 'B'; row.getCell(4).value = v;
        });
      }

      const lotTag = q.lot_no || '발취';
      const dateTag = (td.start || new Date().toISOString().slice(0, 10)).replace(/-/g, '');
      const fileName = `${lotTag}_${q.material || '개폐기'}_${pool.length}대_${dateTag}.xlsx`;
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
    }

    function downloadPDF(q, kind = 'both') {
      let inner = '';
      if (kind === 'gapji') inner = gapjiHTML(q);
      else if (kind === 'eulji') inner = euljiHTML(q);
      else inner = gapjiHTML(q) + '<div class="pgbreak"></div>' + euljiHTML(q) + attachmentsHTML(q);

      const title = `개폐기류_시험성적서_${q.lot_no || '최종'}`;
      
      if (typeof html2pdf !== 'undefined') {
        const container = document.createElement('div');
        container.className = 'print-shell-export';
        container.style.cssText = 'width:210mm; padding:10mm; background:#fff; color:#000; font-family:"Malgun Gothic", sans-serif;';
        // reportShell()과 동일한 스타일(표 테두리·색상·레이아웃)을 적용해야 실제 저장 PDF도 화면/인쇄본과 동일하게 예쁘게 나옴
        // ('.print-shell-export'로 스코핑하여 편집 화면 UI에는 영향이 가지 않도록 함)
        container.innerHTML = reportStyles('.print-shell-export') + inner;
        document.body.appendChild(container);

        const opt = {
          margin: [8, 8, 8, 8],
          filename: `${title}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };
        html2pdf().set(opt).from(container).toPdf().get('pdf').then(async (pdf) => {
          // 매 페이지 우측 하단에 한전 로고 워터마크 + 하단 중앙에 페이지 번호 스탬프
          try {
            const wm = await getKepcoWatermark(0.16);
            const totalPages = pdf.internal.getNumberOfPages();
            const hMM = 15, wMM = hMM * (wm.ratio || 1);
            for (let p = 1; p <= totalPages; p++) {
              pdf.setPage(p);
              const pw = pdf.internal.pageSize.getWidth();
              const ph = pdf.internal.pageSize.getHeight();
              pdf.addImage(wm.dataUrl, 'PNG', pw - wMM - 6, ph - hMM - 6, wMM, hMM);
              pdf.setFontSize(8);
              pdf.setTextColor(140);
              pdf.text(`${p} / ${totalPages}`, pw / 2, ph - 5, { align: 'center' });
            }
          } catch (e) {
            console.warn('워터마크/페이지번호 스탬프 실패(본문은 정상 저장됨):', e);
          }
        }).save().then(() => {
          document.body.removeChild(container);
        }).catch(err => {
          console.error("html2pdf error:", err);
          document.body.removeChild(container);
          printReport(q, kind);
        });
      } else {
        printReport(q, kind);
      }
    }

    function printReport(q,kind){
      const inner = gapjiHTML(q)+'<div class="pgbreak"></div>'+euljiHTML(q)+attachmentsHTML(q);
      const title = `${q.lot_no||''}${q.material?'_'+q.material:''} 시험성적서`;
      const w=window.open('','_blank');
      w.document.write(reportShell(title, inner));
      w.document.close();
      setTimeout(()=>w.print(), 400);
    }

    function applyTheme(themeName) {
      document.documentElement.dataset.theme = themeName;
      try {
        localStorage.setItem("kepco_ui_theme_v1", themeName);
      } catch(e){}
      const sel = $('uiThemeSel');
      if (sel && sel.value !== themeName) sel.value = themeName;
    }

    function setupTheme() {
      let savedTheme = "light";
      try {
        savedTheme = localStorage.getItem("kepco_ui_theme_v1") || "light";
      } catch(e){}
      applyTheme(savedTheme);
      const sel = $('uiThemeSel');
      if (sel) {
        sel.onchange = function(e) {
          applyTheme(e.target.value);
        };
      }
    }
    setupTheme();

    // 키보드 접근성 및 빈 입력 필드 강조 로직
    function setupKeyboardAccess() {
      // 리스트 아이템, 스텝 칩 요소에 탭 포커스 부여
      document.querySelectorAll('.item:not([tabindex]), .step-chip:not([tabindex]), .stepBtn:not([tabindex])').forEach(el => {
        el.setAttribute('tabindex', '0');
      });
      // 입력 전인 필수 입력 필드 및 선택되지 않은 콤보박스(select) 강조 (테마 선택 드롭다운 제외)
      document.querySelectorAll('input:not([readonly]):not([type="checkbox"]):not([type="radio"]):not([type="file"]), textarea:not([readonly]), select:not(#uiThemeSel)').forEach(el => {
        if (!el.value) {
          el.classList.add('empty-field');
        } else {
          el.classList.remove('empty-field');
        }
      });
    }

    // 엔터키 및 스페이스바 키보드 이벤트 처리 (마우스 클릭 대체)
    document.addEventListener("keydown", (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; // 인풋창에서는 기본 동작 유지
        if (e.target.classList.contains('item') || e.target.classList.contains('step-chip') || e.target.classList.contains('stepBtn') || e.target.tagName === 'BUTTON') {
          e.preventDefault();
          e.target.click();
        }
      }
    });

    // 입력 및 DOM 변경 시 빈칸 스타일 즉각 업데이트
    document.addEventListener("input", setupKeyboardAccess);
    document.addEventListener("change", setupKeyboardAccess);
    const uiObserver = new MutationObserver(setupKeyboardAccess);
    uiObserver.observe(document.body, { childList: true, subtree: true });
  
    window.SPECS = typeof SPECS !== 'undefined' ? SPECS : [];
    window.MAKERS = typeof MAKERS !== 'undefined' ? MAKERS : [];
</script>
