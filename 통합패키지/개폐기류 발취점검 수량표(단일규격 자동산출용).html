<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>개폐기류 규격별 발취점검 수량표 (단일규격용)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', '맑은 고딕', system-ui, sans-serif;
    font-size: 9.5pt;
    background: #f8fafc;
    color: #0f172a;
    padding: 8mm;
    line-height: 1.5;
  }
  .app-container {
    max-width: 900px;
    margin: 0 auto;
  }
  .header-bar {
    background: #ffffff;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    padding: 15px 20px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .title-box { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
  .title-box h1 { font-size: 16pt; font-weight: 900; color: #000000; letter-spacing: -0.5px; }
  .title-box p { font-size: 9pt; color: #475569; font-weight: 600; margin-top: 4px; }
  
  .spec-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .spec-btn {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 9pt;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .spec-btn:hover { background: #e2e8f0; }
  .spec-btn.active {
    background: #0f172a;
    color: #ffffff;
    border-color: #0f172a;
  }

  .ctrl-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f5f9;
    padding: 10px 15px;
    border-radius: 6px;
    border: 1px solid #94a3b8;
    flex-wrap: wrap;
    gap: 10px;
  }
  .ctrl-item { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #000000; }
  .ctrl-item select, .ctrl-item input {
    font-family: inherit; font-size: 9pt; font-weight: 800;
    padding: 4px 8px; border-radius: 4px; border: 1px solid #475569; outline: none;
  }
  .ctrl-item input { width: 70px; text-align: right; }
  
  .qty-btns { display: flex; gap: 4px; }
  .qty-btn {
    background: #ffffff; border: 1px solid #475569; color: #000000;
    font-size: 8.5pt; font-weight: 800; padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .qty-btn:hover { background: #e2e8f0; }
  .qty-btn.reset { color: #dc2626; border-color: #dc2626; }
  .qty-btn.reset:hover { background: #fef2f2; }

  .filter-bar {
    display: flex; align-items: center; gap: 10px; font-size: 8.5pt; font-weight: 700;
    margin-bottom: 12px; padding: 0 5px;
  }
  .filter-bar input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
  .filter-bar label { cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .table-container { background: #ffffff; border-radius: 6px; overflow: hidden; border: 1px solid #475569; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  table { width: 100%; border-collapse: collapse; font-size: 11pt; }
  thead th { background: #0f172a; color: #ffffff; padding: 10px 12px; text-align: left; border: 1px solid #334155; font-weight: 800; vertical-align: middle; font-size: 11pt; }
  thead th.th-val { text-align: center; }
  thead th.th-sub { text-align: center; background: #1e293b; color: #e2e8f0; font-size: 10pt; width: 25%; }
  
  tbody tr td { background: #ffffff; border: 1px solid #94a3b8; padding: 8px 12px; vertical-align: middle; line-height: 1.4; }
  tbody tr:hover td { background: #f1f5f9 !important; }
  
  td.cell-item { font-weight: 800; color: #000000 !important; background: #f8fafc !important; width: 35%; font-size: 11pt; position: relative; cursor: help; }
  td.cell-item:hover .tooltip { opacity: 1; visibility: visible; transform: translateY(0); }
  .tooltip {
    position: absolute; left: 10px; bottom: 100%; margin-bottom: 5px;
    background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 10px 14px;
    border-radius: 6px; font-size: 10.5pt; font-weight: 700;
    white-space: normal; width: max-content; max-width: 350px; line-height: 1.4;
    opacity: 0; visibility: hidden; transform: translateY(5px);
    transition: all 0.2s ease-out; z-index: 50; pointer-events: none;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
  }
  .tooltip::after {
    content: ''; position: absolute; top: 100%; left: 15px;
    border-width: 6px; border-style: solid;
    border-color: rgba(15, 23, 42, 0.95) transparent transparent transparent;
  }
  td.cell-rule { text-align: center; color: #334155; font-weight: 700; white-space: pre-line; font-size: 10.5pt; }
  td.cell-calc { text-align: center; }

  .calc-text { display: inline-block; font-size: 11pt; font-weight: 900; color: #0369a1; }

  /* Colors for calc-text based on rule type */
  .calc-full   { color: #1d4ed8; }
  .calc-cert   { color: #334155; }
  .calc-norm   { color: #0369a1; }
  .calc-spec   { color: #c2410c; }
  .calc-exempt { color: #be185d; }
  
  .empty-state { padding: 40px; text-align: center; color: #64748b; font-weight: 700; font-size: 11pt; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header-bar">
    <div class="title-box">
      <div>
        <h1>📋 개폐기류 발취점검 수량표 (단일규격 산출)</h1>
        <p>한국전력공사 전력기자재센터 | 단일 규격 전용 자동계산기</p>
      </div>
    </div>

    <!-- 규격 선택 버튼들 -->
    <div class="spec-selector" id="specSelector">
      <!-- Generated via JS -->
    </div>

    <div class="ctrl-bar">
      <div class="ctrl-item">
        <label for="selGrade">품질등급:</label>
        <select id="selGrade">
          <option value="S">S등급 (0.5배)</option>
          <option value="A">A등급 (0.5배)</option>
          <option value="B" selected>B등급 (Normal - 1.0배)</option>
          <option value="C">C등급 (2.0배)</option>
          <option value="D">D등급 (2.0배)</option>
        </select>
      </div>

      <div class="ctrl-item">
        <label for="inpQty">납품수량:</label>
        <input type="number" id="inpQty" value="0" min="0" max="9999"/> 대
        <div class="qty-btns">
          <button class="qty-btn reset" onclick="addQty('reset')">초기화</button>
          <button class="qty-btn" onclick="addQty(1)">+1</button>
          <button class="qty-btn" onclick="addQty(10)">+10</button>
          <button class="qty-btn" onclick="addQty(100)">+100</button>
        </div>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <label><input type="checkbox" id="chkHideNa" checked> 미해당 항목(-) 숨기기</label>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th rowspan="2">시험검사 항목명</th>
          <th colspan="2" class="th-val" id="thSpecName">규격을 선택하세요</th>
        </tr>
        <tr>
          <th class="th-sub">기준 (발취 조건)</th>
          <th class="th-sub">산출수량</th>
        </tr>
      </thead>
      <tbody id="matrixBody">
        <tr><td colspan="3" class="empty-state">위에서 규격을 선택해 주세요.</td></tr>
      </tbody>
    </table>
  </div>
</div>

        "rule": "성적서 대체",
        "type": "cert"
      },
      "REC": {
        "rule": "성적서 대체",
        "type": "cert"
      }
    }
  },
  {
    "name": "33. 상연결 접속재 시험",
    "rules": {
      "EMCB": {
        "rule": "1대/20대",
        "fnKey": "per_20",
        "type": "spec"
      },
      "EPOXY": {
        "rule": "1대/10대",
        "fnKey": "per_10",
        "type": "spec"
      }
    }
  },
  {
    "name": "34. 절연유 특성시험",
    "rules": {
      "EPOXY": {
        "rule": "생산중인 제품에서 임의 발취",
        "type": "norm"
      }
    }
  },
  {
    "name": "35. 밀봉재(O-링) 재질시험",
    "rules": {
      "DRYAIR": {
        "rule": "성적서 대체",
        "type": "cert"
      }
    }
  },
  {
    "name": "36. 고체절연물 물성시험(에폭시)",
    "rules": {
      "DRYAIR": {
        "rule": "성적서 대체",
        "type": "cert"
      }
    }
  },
  {
    "name": "37. 기타 부품 성적서",
    "rules": {}
  }
];
  const SPECS_KEYS = ["POLE","EMCB","EPOXY","DRYAIR","AIRPAD","DREC","PREC","EFI","REC"];
  const SPEC_HEADERS = {"POLE":{"name":"ECO 부하개폐기","tag":"가공용"},"EMCB":{"name":"에폭시 다회로차단기","tag":"지중용"},"EPOXY":{"name":"에폭시절연 부하개폐기","tag":"지상용"},"DRYAIR":{"name":"Dry air 절연 부하개폐기","tag":"지중용"},"AIRPAD":{"name":"일반형 공기절연 부하개폐기","tag":"지중/지상용"},"DREC":{"name":"폴리머절연 방향성 R/C","tag":"가공용"},"PREC":{"name":"펄스기능부 폴리머R/C","tag":"가공용"},"EFI":{"name":"에폭시절연 고장구간 차단기","tag":"가공용"},"REC":{"name":"폴리머절연 리클로저","tag":"가공용"}};
  
  let currentSpec = SPECS_KEYS[0]; // Default to POLE

  function initUI() {
    const selDiv = document.getElementById('specSelector');
    selDiv.innerHTML = SPECS_KEYS.map(k => {
      const h = SPEC_HEADERS[k];
      return `<button class="spec-btn ${k === currentSpec ? 'active' : ''}" data-key="${k}">${h.name} (${h.tag})</button>`;
    }).join('');

    document.querySelectorAll('.spec-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.spec-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentSpec = e.target.getAttribute('data-key');
        renderTable();
      });
    });

    document.getElementById('selGrade').addEventListener('change', renderTable);
    document.getElementById('inpQty').addEventListener('input', renderTable);
    document.getElementById('chkHideNa').addEventListener('change', renderTable);
    
    renderTable();
  }

  function addQty(val) {
    const inp = document.getElementById('inpQty');
    if (val === 'reset') {
      inp.value = 0;
    } else {
      let cur = parseInt(inp.value) || 0;
      inp.value = cur + val;
    }
    renderTable();
  }

  function renderTable() {
    if(!currentSpec) return;

    const grade = document.getElementById('selGrade').value;
    const qty = parseInt(document.getElementById('inpQty').value) || 0;
    const mult = GRADE_MULT[grade] || 1.0;
    const hideNa = document.getElementById('chkHideNa').checked;
    const h = SPEC_HEADERS[currentSpec];

    document.getElementById('thSpecName').innerHTML = `${h.name} <span style="font-size:7.5pt; background:#334155; padding:2px 5px; border-radius:4px; margin-left:4px;">${h.tag}</span>`;

    const tbody = document.getElementById('matrixBody');
    tbody.innerHTML = '';

    let visibleCount = 0;

    FLAT_ITEMS.forEach((item) => {
      const ruleObj = item.rules[currentSpec];
      if (!ruleObj) {
        if(!hideNa) {
           tbody.innerHTML += `<tr><td class="cell-item">${item.name}</td><td class="cell-val" style="color:#94a3b8;">해당없음 (-)</td></tr>`;
        }
        return;
      }
      
      if (ruleObj.type === 'na' || ruleObj.rule === '-') {
        if(hideNa) return;
        tbody.innerHTML += `<tr><td class="cell-item">${item.name}</td><td class="cell-val" style="color:#94a3b8;">해당없음 (-)</td></tr>`;
        return;
      }

      visibleCount++;
      const tr = document.createElement('tr');
      let html = `<td class="cell-item">
        ${item.name}
        <div class="tooltip">${(TOOLTIP_DATA[item.name] || '요약 정보가 없습니다.').replace(/\n/g, '<br>')}</div>
      </td>`;

      let cssClass = 'cell-val ';
      if (ruleObj.type === 'full') cssClass += 'c-full';
      else if (ruleObj.type === 'cert') cssClass += 'c-cert';
      else if (ruleObj.type === 'spec') cssClass += 'c-spec';
      else cssClass += 'c-norm';

      if (ruleObj.exemptSA && (grade === 'S' || grade === 'A')) cssClass += ' c-exempt';

      let ruleDisp = ruleObj.rule;
      let calcDisp = '';

      if (qty === 0) {
        // When qty is 0, do not show any calculated value
        calcDisp = '';
      } else if (ruleObj.type === 'full') {
        calcDisp = `${qty}대 (전량)`;
      } else if (ruleObj.type === 'cert') {
        calcDisp = '제출확인';
      } else if (ruleObj.exemptSA && (grade === 'S' || grade === 'A')) {
        calcDisp = '면제';
      } else if (ruleObj.fnKey && S_FNS[ruleObj.fnKey]) {
        const baseCount = S_FNS[ruleObj.fnKey](qty);
        let finalCount = Math.max(1, Math.round(baseCount * mult));
        if (ruleObj.fnKey === 'fixed_1') finalCount = 1;
        calcDisp = `${finalCount}대`;
      }

      // Add Rule Cell (기준)
      html += `<td class="cell-rule">${ruleDisp}</td>`;
      
      let calcClass = 'calc-norm';
      if (ruleObj.type === 'full') calcClass = 'calc-full';
      else if (ruleObj.type === 'cert') calcClass = 'calc-cert';
      else if (ruleObj.type === 'spec') calcClass = 'calc-spec';
      if (ruleObj.exemptSA && (grade === 'S' || grade === 'A')) calcClass = 'calc-exempt';

      // Add Calc Cell (산출수량)
      html += `<td class="cell-calc">
        ${calcDisp ? `<div class="calc-text ${calcClass}">${calcDisp}</div>` : ''}
      </td>`;

      tr.innerHTML = html;
      tbody.appendChild(tr);
    });

    if(visibleCount === 0) {
      tbody.innerHTML = '<tr><td colspan="2" class="empty-state">표시할 항목이 없습니다.</td></tr>';
    }
  }

  window.addEventListener('DOMContentLoaded', initUI);
</script>
